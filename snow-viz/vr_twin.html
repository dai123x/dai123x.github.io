    .telemetry-badge {
      display: flex; align-items: center; gap: 8px; color: var(--emerald); font-weight: 600;
    }
    .dot-live {
      width: 8px; height: 8px; border-radius: 50%; background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald); animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* 右侧数据叙事 HUD 面板 */
    .hud-panel {
      position: absolute; top: 60px; right: 24px; width: 420px;
      max-height: calc(100vh - 136px); overflow-y: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      border-left: 3px solid var(--gold);
      border-radius: 8px; padding: 20px 22px; z-index: 10;

    .hud-tag {

      background: rgba(56, 189, 248, 0.15); border: 1px solid var(--cyan);
      color: var(--cyan); border-radius: 4px; margin-bottom: 10px;
    }
    .hud-title {

      background: linear-gradient(90deg, #ffffff, #93c5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .hud-subtitle {
      font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .kpi-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
    }
    .kpi-card {
      background: rgba(15, 32, 62, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 6px; padding: 10px;
    }
    .kpi-card.full { grid-column: span 2; }
    .kpi-label { font-size: 11px; color: var(--text-sub); margin-bottom: 3px; }
    .kpi-val { font-size: 22px; font-weight: 800; color: var(--gold); font-family: monospace; }
    .kpi-val.cyan { color: var(--cyan); }
    .kpi-val.emerald { color: var(--emerald); }
    .kpi-desc { font-size: 11px; color: #cbd5e1; margin-top: 4px; line-height: 1.4; }

      margin-top: 10px; padding: 10px; border-radius: 6px;
      background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .control-box label {

        ${ch.html}
      `;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.id) === chId);
      });

      targetCamPos.set(...ch.camPos);
      targetLookAt.set(...ch.target);

      Object.values(groups).forEach(g => {
        g.visible = false;
        g.position.set(0, 0, 0);
        g.scale.set(1, 1, 1);
      });

      if (chId === 1) groups.ch1.visible = true;
      if (chId === 2) {
        groups.ch2_4.visible = true;
        climateSubGroup.visible = false;
        terrainUniforms.uStressMode.value = 0.0;
        terrainUniforms.uSnowline.value = 0.32;
      }
      if (chId === 3) groups.ch3.visible = true;
      if (chId === 4) {
        groups.ch2_4.visible = true;
        climateSubGroup.visible = true;
        terrainUniforms.uStressMode.value = 1.0;
        terrainUniforms.uSnowline.value = 0.46;
        bindElNinoSlider();
      }
      if (chId === 5) groups.ch5.visible = true;
      if (chId === 6) groups.ch6.visible = true;
      if (chId === 7) groups.ch7.visible = true;
      if (chId === 8) groups.ch8.visible = true;
      if (chId === 9) {
        groups.ch2_4.visible = true;
        climateSubGroup.visible = true;
        groups.ch1.visible = true; groups.ch1.position.set(-7.5, 4.5, 2.5); groups.ch1.scale.setScalar(0.55);
        groups.ch3.visible = true; groups.ch3.position.set(7.5, 4.5, 2.5);  groups.ch3.scale.setScalar(0.5);
        groups.ch7.visible = true; groups.ch7.position.set(-7.5, -4.5, 2.5); groups.ch7.scale.setScalar(0.5);
        groups.ch8.visible = true; groups.ch8.position.set(7.5, -4.5, 2.5);  groups.ch8.scale.setScalar(0.55);
      }
    }

    function bindElNinoSlider() {
      const slider = document.getElementById('elnino-slider');
      if (!slider) return;
      slider.addEventListener('input', (e) => {
        const dt = parseFloat(e.target.value);
        document.getElementById('temp-label').textContent = `+${dt.toFixed(1)} °C`;
        terrainUniforms.uSnowline.value = 0.28 + dt * 0.1;
        const days = Math.round(96 - dt * 6.1);
        const water = (1.05 + dt * 0.11).toFixed(2);
        const res = (0.945 - dt * 0.029).toFixed(3);
        document.getElementById('val-window').textContent = `≥ ${days} 天`;
        document.getElementById('val-water').textContent = `${water} 亿m³`;
        document.getElementById('val-resilience').textContent = res;
      });
    }

    // 初始化导航
    const navContainer = document.getElementById('nav-tabs');
    CHAPTERS.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.dataset.id = ch.id;
      btn.textContent = ch.code + ' ' + ch.name.split(' · ')[1];
      btn.onclick = () => switchChapter(ch.id);
      navContainer.appendChild(btn);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') switchChapter(currentChapter < 9 ? currentChapter + 1 : 1);
      if (e.key === 'ArrowLeft')  switchChapter(currentChapter > 1 ? currentChapter - 1 : 9);
    });

    switchChapter(1);

    // ==================== 6. GLTF (.glb) 模型导出器 ====================
    document.getElementById('btn-export-glb').onclick = () => {
      const exporter = new GLTFExporter();
      const currentGroup = Object.values(groups).find(g => g.visible) || scene;
      exporter.parse(
        currentGroup,
        (gltf) => {
          const blob = new Blob([gltf], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `雪线之上_第0${currentChapter}幕_三维模型.glb`;
          link.click();
        },
        (error) => {
          console.error('Export error:', error);
          alert('导出失败: ' + error);
        },
        { binary: true }
      );
    };

    // ==================== 7. 60 FPS 渲染循环 ====================
    let lastTime = performance.now(), frames = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      terrainUniforms.uTime.value = elapsed;

      frames++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fps-counter').textContent = `LIVE ${Math.min(60, frames)} FPS VR TELEMETRY`;
        frames = 0; lastTime = now;
      }

      const posArr = snowGeo.attributes.position.array;
      for (let i = 2; i < posArr.length; i += 3) {
        posArr[i] -= 0.035;
        if (posArr[i] < -15) posArr[i] = 15;
      }
      snowGeo.attributes.position.needsUpdate = true;

      if (groups.ch1.visible) {
        groups.ch1.rotation.y = elapsed * 0.28;
        groups.ch1.rotation.x = Math.sin(elapsed * 0.4) * 0.15;
      }
      if (groups.ch3.visible) {
        groups.ch3.children[0].rotation.z = elapsed * 0.25;
        groups.ch3.children[0].rotation.y = Math.sin(elapsed * 0.5) * 0.35;
        groups.ch3.children[1].rotation.y = -elapsed * 0.3;
      }
      if (groups.ch7.visible) {
        groups.ch7.rotation.z = elapsed * 0.35;
      }
      if (groups.ch8.visible && currentChapter === 8) {
        groups.ch8.rotation.z = Math.sin(elapsed * 0.25) * 0.22;
      }

      camera.position.lerp(targetCamPos, 0.045);
      controls.target.lerp(targetLookAt, 0.045);
      controls.update();

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
