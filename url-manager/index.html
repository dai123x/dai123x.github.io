<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>个人专属网址管理系统 · 网站预存与快速导航 | 戴璇</title>
  <meta name="description" content="专为高频网址、开发工具与常用站点打造的轻量级个人导航管理系统，支持即时模糊搜索、分类管理、暗黑模式切换、JSON备份与本地离线持久化。">
  <meta name="author" content="戴璇">
  <link rel="canonical" href="https://daixuan.cloud/url-manager/">
  <meta property="og:title" content="个人专属网址管理系统 · 网站预存与快速导航">
  <meta property="og:description" content="专为高频网址、开发工具打造的轻量级个人导航管理系统，支持即时模糊搜索、分类管理、暗黑模式切换与本地持久化。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daixuan.cloud/url-manager/">
  <meta property="og:site_name" content="戴璇 · daixuan.cloud">
  <link rel="stylesheet" href="style.css">
  <!-- 预留常用 favicon 备用 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dx_theme') || localStorage.getItem('url_manager_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body data-theme="light">
  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="navbar-left">
      <a href="../" class="back-home-link" title="返回戴璇的个人主页">
        <span class="back-arrow">←</span>
        <span>主页</span>
      </a>
      <div class="logo">
        <span class="logo-icon">🚀</span>
        <div class="logo-text">
          <span class="logo-title">网站预存管理系统</span>
          <span class="logo-sub" id="itemCountBadge">已收录 0 个站点</span>
        </div>
      </div>
    </div>

    <!-- 居中全局搜索框 -->
    <div class="navbar-center">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜索网址、名称、介绍... (快捷键 /)" 
          autocomplete="off" 
          spellcheck="false"
        >
        <button id="clearSearchBtn" class="clear-search-btn" title="清空搜索" style="display: none;">×</button>
        <div class="search-shortcut-hint">/</div>
      </div>
    </div>

    <!-- 右侧功能操作区 -->
    <div class="navbar-right">
      <!-- 实时同步状态微标 -->
      <div class="sync-indicator" id="syncStatus" title="数据实时同步状态">
        <span class="sync-dot"></span>
        <span class="sync-text">本地就绪</span>
      </div>

      <button id="openAddModalBtn" class="btn btn-primary" title="新增网址 (Alt + N)">
        <span class="btn-icon">+</span>
        <span>添加网址</span>
      </button>

      <button id="openCategoryModalBtn" class="btn btn-secondary" title="管理分类">
        <span class="btn-icon">📁</span>
        <span>分类管理</span>
      </button>

      <div class="action-dropdown-wrapper">
        <button id="moreActionsBtn" class="btn btn-icon-only" title="更多功能 (备份与导入)">
          ⚙️
        </button>
        <div class="dropdown-menu" id="moreDropdown">
          <button class="dropdown-item" id="exportDataBtn">
            <span>📥</span> 导出数据备份 (JSON)
          </button>
          <label class="dropdown-item" for="importFileInput">
            <span>📤</span> 导入备份数据 (JSON)
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
          </label>
          <hr style="border: none; border-top: 1px solid var(--border-color); margin: 4px 0;">
          <button class="dropdown-item" id="shutdownServiceBtn" style="color: var(--danger);">
            <span>🛑</span> 关闭后台服务
          </button>
        </div>
      </div>

      <button id="themeToggleBtn" class="btn btn-icon-only theme-btn" title="切换明亮/暗黑主题">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- 主体内容区域 -->
  <main class="main-container">
    <!-- 分类过滤栏 (横向胶囊切换) -->
    <nav class="category-tabs" id="categoryTabs">
      <!-- 由 JS 动态渲染 -->
    </nav>

    <!-- 网址卡片容器 -->
    <section class="sites-section">
      <div class="sites-grid" id="sitesGrid">
        <!-- 网址卡片由 JS 动态生成 -->
      </div>

      <!-- 空状态展示 -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">📂</div>
        <h3 class="empty-title">没有找到匹配的网址</h3>
        <p class="empty-desc">尝试更换搜索词，或点击上方“添加网址”收录新链接。</p>
        <button class="btn btn-primary" id="emptyAddBtn">+ 立即添加新网址</button>
      </div>
    </section>
  </main>

  <!-- 弹窗 1：添加/编辑网址 -->
  <div class="modal-overlay" id="siteModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="siteModalTitle">添加新网址</h3>
        <button class="modal-close" id="closeSiteModalBtn">&times;</button>
      </div>
      <form id="siteForm" class="modal-body">
        <input type="hidden" id="siteId">
        <div class="form-group">
          <label for="siteUrl">网站链接 (URL) <span class="required">*</span></label>
          <div class="url-input-wrap">
            <input 
              type="text" 
              id="siteUrl" 
              name="siteUrl" 
              placeholder="例如: https://github.com" 
              required
              autocomplete="off"
            >
            <button type="button" id="autoFetchTitleBtn" class="btn btn-sm btn-ghost" title="根据网址自动提取建议标题">自动提取</button>
          </div>
        </div>

        <div class="form-group">
          <label for="siteTitle">网站名称 <span class="required">*</span></label>
          <input 
            type="text" 
            id="siteTitle" 
            name="siteTitle" 
            placeholder="例如: GitHub 官网" 
            required
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="siteCategory">所属分类 <span class="required">*</span></label>
          <select id="siteCategory" name="siteCategory" required>
            <!-- 动态生成分类选项 -->
          </select>
        </div>

        <div class="form-group">
          <label for="siteDesc">网站描述 / 备忘说明 (选填)</label>
          <textarea 
            id="siteDesc" 
            name="siteDesc" 
            rows="2" 
            placeholder="简要写写这个网站是干什么的、账号提示或用途备注..."
          ></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelSiteModalBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveSiteBtn">保存收录</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 弹窗 2：分类管理 -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-dialog modal-md">
      <div class="modal-header">
        <h3>分类管理</h3>
        <button class="modal-close" id="closeCategoryModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="category-add-row">
          <input 
            type="text" 
            id="newCategoryIcon" 
            class="input-emoji" 
            value="📌" 
            maxlength="4" 
            title="分类图标 (支持输入任意 Emoji 表情)"
          >
          <input 
            type="text" 
            id="newCategoryName" 
            placeholder="输入新分类名称 (如: 办公常用)" 
            autocomplete="off"
          >
          <button type="button" id="addCategoryBtn" class="btn btn-primary">添加分类</button>
        </div>

        <div class="category-list" id="categoryList">
          <!-- 动态渲染分类条目 -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="finishCategoryBtn">完成</button>
      </div>
    </div>
  </div>

  <!-- 吐司通知提示 (Toast) -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 引入业务脚本 -->
  <script src="app.js"></script>
</body>
</html>
