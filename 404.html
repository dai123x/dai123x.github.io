<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <title>404 · 页面未找到 | 戴璇 · daixuan.cloud</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0e17">
  <meta name="description" content="页面不存在或已被移动。daixuan.cloud 是戴璇的个人学术与工程门户：明史资料平台、朗读室、数据实验室、案例研究与 3D 交互作品。">
  <meta property="og:title" content="404 · 页面漂出了雪线之外 | 戴璇 · daixuan.cloud">
  <meta property="og:description" content="你要找的页面不存在。这里有几条通往主要作品的路。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daixuan.cloud/404.html">
  <meta property="og:site_name" content="戴璇 · Dai Xuan">
  <!-- 主题：与站内其它页面同口径 —— localStorage.dx_theme 优先，系统偏好兜底。
       之前这一页写死深色，浅色用户从主页跳过来会突然全黑。 -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('dx_theme'); } catch (e) { /* 隐私模式 */ }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'light' ? '#f8fafc' : '#0a0e17';
    })();
  </script>
  <style>
    :root {
      --bg: #0a0e17;
      --card: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #818cf8;
      --meta: #738196;
      /* 与全站暗色主题的品牌渐变完全一致（见 css/style.css 的 --accent-gradient）。
         原先这里是独立的三停靠点版本 linear-gradient(#7c83f5, #8b5cf6, #ec4899)，
         中停靠点 #8b5cf6 的亮度 (0.1980) 比左右邻居 (#7c83f5 0.2711 / #ec4899 0.2477)
         都低，是个「亮度凹陷」；深色字压上去在 t≈53.7% 处只有 4.47:1，差 0.03 不达标。
         换成全站同款后稠密采样最坏 4.78:1，且 404 大字与首页品牌色统一。 */
      --grad: linear-gradient(135deg, #818cf8 0%, #7c83f5 28%, #a855f7 62%, #ec4899 100%);
      --on-accent: #0b1020;
      --ghost-bg: rgba(31, 41, 55, 0.6);
      --orb-opacity: 0.35;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    /* 浅色：沿用主页的 --bg #f8fafc / --text #0f172a 一套，渐变字与按钮色不变，
       只把卡片、边框、灰阶和光球强度换掉。 */
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: rgba(255, 255, 255, 0.82);
      --border: rgba(15, 23, 42, 0.09);
      --text: #0f172a;
      --muted: #475569;
      --accent: #4f46e5;
      --meta: #64748b;
      /* 按钮文字保持深色：渐变左端 #818cf8 上白字只有 3.3:1（不达标），
         深色字 #0b1020 稠密采样最坏 4.78:1。浅色主题不能想当然改成白字。 */
      --on-accent: #0b1020;
      --ghost-bg: rgba(241, 245, 249, 0.9);
      --orb-opacity: 0.22;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { overflow-x: hidden; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      padding: 24px;
      /* 装饰光球负边距越界会被计入可滚动区域，必须同时裁剪横向滚动 */
      overflow: hidden;
      overflow-x: hidden;
      position: relative;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: var(--orb-opacity);
      pointer-events: none;
    }
    .orb-1 { width: 420px; height: 420px; background: #312e81; top: -160px; left: -120px; }
    .orb-2 { width: 380px; height: 380px; background: #831843; bottom: -160px; right: -100px; }
    .card {
      position: relative;
      max-width: 560px;
      width: 100%;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 1.35rem; margin: 18px 0 10px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.7; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      color: var(--on-accent);
      background: var(--grad);
    }
    .btn-ghost {
      color: var(--text);
      background: var(--ghost-bg);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: rgba(99, 102, 241, 0.4); }
    /* #64748b 压在 .card 的 rgba(17,24,39,.75) 上实测只有 3.81:1；
       卡片底色比页面底色浅，所以这里必须比页面上的同级灰更亮。 */
    .meta { margin-top: 26px; font-size: 0.8rem; color: var(--meta); }
    .meta a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <main class="card">
    <div class="code">404</div>
    <h1>页面漂出了雪线之外</h1>
    <p>你要找的页面不存在，或者已经被移动到了别的地方。<br>别担心，主页和下面这些作品都还在。</p>
    <nav class="actions" aria-label="返回导航">
      <a class="btn btn-primary" href="/">回到首页</a>
      <a class="btn btn-ghost" href="/#projects">精选项目</a>
      <a class="btn btn-ghost" href="/ming-history/">明史资料平台</a>
      <a class="btn btn-ghost" href="/words/">朗读室</a>

      <a class="btn btn-ghost" href="/snow-viz/">雪线之上</a>
      <a class="btn btn-ghost" href="/aurora-chat/">极光 AI 工作台</a>
    </nav>
    <p class="meta">daixuan.cloud · <a href="https://github.com/dai123x" rel="noopener noreferrer">GitHub @dai123x</a></p>
  </main>
</body>
</html>
