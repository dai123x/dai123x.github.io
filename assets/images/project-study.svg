<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="studyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#studyBg)"/>

  <!-- Knowledge Tree / Flashcard Illustration -->
  <g transform="translate(100, 50)">
    <!-- Central Node -->
    <rect x="150" y="20" width="100" height="40" rx="10" fill="url(#emeraldGrad)"/>
    <text x="175" y="45" fill="#ffffff" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">CET-6</text>

    <!-- Branch lines -->
    <path d="M 200 60 L 200 90 L 80 90 L 80 120" stroke="#34d399" stroke-width="2" fill="none"/>
    <path d="M 200 90 L 200 120" stroke="#34d399" stroke-width="2" fill="none"/>
    <path d="M 200 90 L 320 90 L 320 120" stroke="#34d399" stroke-width="2" fill="none"/>

    <!-- Left Child: 词汇体系 -->
    <rect x="30" y="120" width="100" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="50" y="145" fill="#a7f3d0" font-size="12" font-weight="600">核心词汇库</text>
    <text x="50" y="165" fill="#5eead4" font-size="11">艾宾浩斯复习</text>

    <!-- Center Child: 听力真题 -->
    <rect x="150" y="120" width="100" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="165" y="145" fill="#a7f3d0" font-size="12" font-weight="600">精听精读</text>
    <text x="165" y="165" fill="#5eead4" font-size="11">真题同义替换</text>

    <!-- Right Child: 写作翻译 -->
    <rect x="270" y="120" width="100" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="285" y="145" fill="#a7f3d0" font-size="12" font-weight="600">高分句型</text>
    <text x="285" y="165" fill="#5eead4" font-size="11">语料库搭建</text>
  </g>

  <!-- Tag Pill -->
  <rect x="70" y="275" width="140" height="30" rx="15" fill="#064e3b" stroke="#34d399"/>
  <text x="85" y="295" fill="#d1fae5" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">📖 备考知识图谱</text>
</svg>
