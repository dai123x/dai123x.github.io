<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_voc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg_voc)"/>
  <pattern id="dots_voc" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="rgba(255,255,255,0.03)" cx="2" cy="2" r="1.5"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#dots_voc)"/>

  <g transform="translate(70, 50)">
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-size="12" font-family="monospace">vocs_emission_control.env</text>

    <!-- UI/Diagram -->
    <g transform="translate(30, 70)">
      <rect width="400" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
      
      <!-- Factory Plant Diagram -->
      <g transform="translate(40, 40)">
        <!-- Tank 1 (Paint) -->
        <path d="M 0,0 L 40,0 L 40,60 L 0,60 Z" fill="#334155"/>
        <path d="M 0,30 L 40,30 L 40,60 L 0,60 Z" fill="#94a3b8"/>
        
        <!-- Pipeline -->
        <path d="M 40,45 L 120,45" fill="none" stroke="#475569" stroke-width="6"/>
        
        <!-- Treatment Chamber (VOCs reduction) -->
        <rect x="120" y="-10" width="80" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
        <circle cx="160" cy="30" r="20" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="4 4"/>
        <path d="M 150,30 L 170,30 M 160,20 L 160,40" stroke="#22c55e" stroke-width="4"/>

        <!-- Output Exhaust -->
        <path d="M 200,10 L 260,10 L 260,-20" fill="none" stroke="#475569" stroke-width="6"/>
        
        <!-- Green Leaf / Clean Air indicator -->
        <path d="M 255,-35 C 245,-45 270,-60 270,-60 C 270,-60 275,-40 265,-30 Z" fill="#22c55e"/>
        <circle cx="260" cy="-45" r="3" fill="#16a34a"/>
        <circle cx="270" cy="-35" r="2" fill="#16a34a"/>
        <circle cx="250" cy="-55" r="2" fill="#16a34a"/>
      </g>
      
      <!-- Metrics overlay -->
      <g transform="translate(310, 50)">
        <text x="0" y="0" fill="#94a3b8" font-size="10" font-family="sans-serif">Emission Reduction</text>
        <text x="0" y="25" fill="#22c55e" font-size="24" font-weight="bold">92.5%</text>
      </g>
    </g>
  </g>
  
  <rect x="85" y="280" width="190" height="30" rx="15" fill="#064e3b" stroke="#10b981"/>
  <text x="100" y="300" fill="#a7f3d0" font-size="12" font-family="sans-serif" font-weight="bold">Environmental Engineering</text>
</svg>
