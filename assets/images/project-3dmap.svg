<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_map" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg_map)"/>
  
  <pattern id="grid_map" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(20, 184, 166, 0.1)" stroke-width="1"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#grid_map)"/>

  <g transform="translate(70, 50)">
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-size="12" font-family="monospace">Three.js - WebGL Campus Map</text>

    <!-- Isometric Map Content -->
    <g transform="translate(230, 100)">
      <!-- Ground plane -->
      <path d="M 0,0 L 140,70 L 0,140 L -140,70 Z" fill="#0f172a" stroke="url(#mapGrad)" stroke-width="1.5"/>
      <path d="M 0,10 L 120,70 L 0,130 L -120,70 Z" fill="none" stroke="rgba(20, 184, 166, 0.2)" stroke-width="1"/>
      
      <!-- Building 1 -->
      <g transform="translate(-40, 50)">
        <path d="M 0,0 L 30,15 L 0,30 L -30,15 Z" fill="#14b8a6" fill-opacity="0.8"/>
        <path d="M -30,15 L 0,30 L 0,-10 L -30,-25 Z" fill="#0d9488" fill-opacity="0.9"/>
        <path d="M 0,30 L 30,15 L 30,-25 L 0,-10 Z" fill="#0f766e" fill-opacity="0.9"/>
        <path d="M 0,-10 L 30,-25 L 0,-40 L -30,-25 Z" fill="#5eead4" fill-opacity="0.9"/>
      </g>
      
      <!-- Building 2 -->
      <g transform="translate(30, 80)">
        <path d="M 0,0 L 20,10 L 0,20 L -20,10 Z" fill="#3b82f6" fill-opacity="0.8"/>
        <path d="M -20,10 L 0,20 L 0,-20 L -20,-30 Z" fill="#2563eb" fill-opacity="0.9"/>
        <path d="M 0,20 L 20,10 L 20,-30 L 0,-20 Z" fill="#1d4ed8" fill-opacity="0.9"/>
        <path d="M 0,-20 L 20,-30 L 0,-40 L -20,-30 Z" fill="#93c5fd" fill-opacity="0.9"/>
      </g>
      
      <!-- Location Pin -->
      <g transform="translate(10, 20)">
        <path d="M 0,-40 C -10,-40 -15,-30 -15,-20 C -15,-5 0,0 0,0 C 0,0 15,-5 15,-20 C 15,-30 10,-40 0,-40 Z" fill="#ef4444"/>
        <circle cx="0" cy="-25" r="5" fill="#ffffff"/>
      </g>
    </g>
  </g>
  
  <rect x="85" y="280" width="160" height="30" rx="15" fill="#042f2e" stroke="#14b8a6"/>
  <text x="100" y="300" fill="#ccfbf1" font-size="12" font-family="sans-serif" font-weight="bold">Three.js &amp; WebGL</text>
</svg>
