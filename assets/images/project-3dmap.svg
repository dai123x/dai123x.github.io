<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bldgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="bldgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="bldgGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg3d)"/>

  <!-- Isometric Ground Grid -->
  <g opacity="0.4" stroke="#4f46e5" stroke-width="1">
    <path d="M 0 180 L 300 330 L 600 180 L 300 30 Z" fill="none"/>
    <path d="M 50 155 L 300 280 L 550 155" fill="none"/>
    <path d="M 100 130 L 300 230 L 500 130" fill="none"/>
    <path d="M 150 105 L 300 180 L 450 105" fill="none"/>
    <line x1="300" y1="30" x2="300" y2="330" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Main 3D Tower (科技大厦模型示意) -->
  <g transform="translate(300, 160)">
    <!-- Base Shadow -->
    <polygon points="0,60 -60,30 0,0 60,30" fill="#020617" opacity="0.6"/>
    <!-- Left Face -->
    <polygon points="-50,20 -50,-80 0,-105 0,-5" fill="url(#bldgGrad1)"/>
    <!-- Right Face -->
    <polygon points="0,-5 0,-105 50,-80 50,20" fill="url(#bldgGrad2)"/>
    <!-- Top Face -->
    <polygon points="0,-105 -50,-80 0,-55 50,-80" fill="#a5b4fc"/>
    <!-- Windows lines -->
    <line x1="-35" y1="-65" x2="-10" y2="-52" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
    <line x1="-35" y1="-45" x2="-10" y2="-32" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
    <line x1="-35" y1="-25" x2="-10" y2="-12" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
    <line x1="-35" y1="-5" x2="-10" y2="8" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
    
    <line x1="10" y1="-52" x2="35" y2="-65" stroke="#e0e7ff" stroke-width="2" opacity="0.8"/>
    <line x1="10" y1="-32" x2="35" y2="-45" stroke="#e0e7ff" stroke-width="2" opacity="0.8"/>
    <line x1="10" y1="-12" x2="35" y2="-25" stroke="#e0e7ff" stroke-width="2" opacity="0.8"/>
    <line x1="10" y1="8" x2="35" y2="-5" stroke="#e0e7ff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Library Building (博厚图书馆示意) -->
  <g transform="translate(190, 210)">
    <polygon points="-40,15 -40,-35 0,-55 0,-5" fill="#2563eb" opacity="0.9"/>
    <polygon points="0,-5 0,-55 60,-25 60,45" fill="#1d4ed8"/>
    <polygon points="0,-55 -40,-35 20,-5 60,-25" fill="#60a5fa"/>
    <circle cx="20" cy="-25" r="4" fill="#38bdf8"/>
  </g>

  <!-- Floating 3D Beacon (光标信标) -->
  <g transform="translate(300, 35)">
    <polygon points="0,0 -8,-24 8,-24" fill="#38bdf8"/>
    <circle cx="0" cy="-30" r="4" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Navigation Flow Line (迎新路线光带) -->
  <path d="M 140 280 Q 230 250 300 230 T 460 210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Badge Overlay -->
  <rect x="25" y="25" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)"/>
  <circle cx="42" cy="41" r="5" fill="#10b981"/>
  <text x="56" y="46" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">Three.js WebGL</text>

  <rect x="445" y="25" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)"/>
  <text x="460" y="46" fill="#cbd5e1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif">全景校园漫游</text>
</svg>
