<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="barGrad_lab" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="badgeGrad_lab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots_lab" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle fill="rgba(255,255,255,0.03)" cx="2" cy="2" r="1.5"/>
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#bg_lab)"/>
  <rect width="600" height="360" fill="url(#dots_lab)"/>

  <!-- 主面板 -->
  <g transform="translate(60,36)">
    <rect width="480" height="228" rx="16" fill="#1e293b" fill-opacity="0.72" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="20" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="20" r="4.5" fill="#10b981"/>
    <text x="64" y="24" fill="#94a3b8" font-size="11" font-family="monospace">sampling_distribution.js</text>
    <line x1="0" y1="38" x2="480" y2="38" stroke="rgba(255,255,255,0.07)"/>

    <!-- 坐标区 -->
    <g transform="translate(36,58)">
      <line x1="0" y1="130" x2="410" y2="130" stroke="rgba(148,163,184,0.35)"/>
      <g fill="url(#barGrad_lab)">
        <rect x="10"  y="112" width="22" height="18" rx="2"/>
        <rect x="36"  y="96"  width="22" height="34" rx="2"/>
        <rect x="62"  y="70"  width="22" height="60" rx="2"/>
        <rect x="88"  y="44"  width="22" height="86" rx="2"/>
        <rect x="114" y="24"  width="22" height="106" rx="2"/>
        <rect x="140" y="14"  width="22" height="116" rx="2"/>
        <rect x="166" y="24"  width="22" height="106" rx="2"/>
        <rect x="192" y="46"  width="22" height="84" rx="2"/>
        <rect x="218" y="74"  width="22" height="56" rx="2"/>
        <rect x="244" y="100" width="22" height="30" rx="2"/>
        <rect x="270" y="118" width="22" height="12" rx="2"/>
      </g>
      <path d="M0,130 C60,130 92,60 153,10 C214,60 246,130 306,130" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
      <line x1="153" y1="4" x2="153" y2="130" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4 4"/>
      <text x="158" y="14" fill="#34d399" font-size="10" font-family="monospace">&#956;</text>
      <text x="0" y="146" fill="#64748b" font-size="9" font-family="monospace">x&#772;</text>
      <text x="304" y="146" fill="#64748b" font-size="9" font-family="monospace" text-anchor="end">n &#8593; &#8594; SE &#8595;</text>
    </g>
  </g>

  <!-- 滑块 -->
  <g transform="translate(96,280)">
    <rect width="408" height="6" rx="3" fill="rgba(148,163,184,0.25)"/>
    <rect width="248" height="6" rx="3" fill="url(#badgeGrad_lab)"/>
    <circle cx="248" cy="3" r="10" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
    <text x="0" y="30" fill="#64748b" font-size="10" font-family="monospace">n = 30</text>
    <text x="408" y="30" fill="#64748b" font-size="10" font-family="monospace" text-anchor="end">&#963;/&#8730;n</text>
  </g>

  <!-- 徽章 -->
  <g transform="translate(60,320)">
    <rect width="178" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="13" y="18" fill="#c7d2fe" font-size="11.5" font-family="sans-serif" font-weight="bold">Interactive Stats Lab</text>
  </g>
</svg>
