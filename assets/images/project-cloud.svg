<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_site" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg_site)"/>
  <pattern id="dots_site" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="rgba(255,255,255,0.03)" cx="2" cy="2" r="1.5"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#dots_site)"/>

  <g transform="translate(70, 50)">
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <rect x="75" y="12" width="200" height="16" rx="4" fill="#1e293b"/>
    <text x="85" y="24" fill="#94a3b8" font-size="10" font-family="monospace">https://www.daixuan.cloud</text>

    <!-- Bento Box Layout inside Browser -->
    <g transform="translate(30, 60)">
      <!-- Box 1 (Profile) -->
      <rect x="0" y="0" width="120" height="160" rx="12" fill="url(#cardGrad)" fill-opacity="0.9"/>
      <circle cx="60" cy="50" r="25" fill="#0f172a"/>
      <rect x="25" y="90" width="70" height="8" rx="4" fill="#94a3b8"/>
      <rect x="35" y="110" width="50" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="30" y="130" width="60" height="16" rx="8" fill="#3b82f6"/>
      
      <!-- Box 2 -->
      <rect x="135" y="0" width="265" height="70" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)"/>
      <rect x="155" y="20" width="100" height="10" rx="5" fill="#38bdf8"/>
      <rect x="155" y="40" width="200" height="6" rx="3" fill="#334155"/>

      <!-- Box 3 -->
      <rect x="135" y="85" width="125" height="75" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="165" cy="122.5" r="15" fill="#10b981" fill-opacity="0.2"/>
      <circle cx="165" cy="122.5" r="6" fill="#10b981"/>

      <!-- Box 4 -->
      <rect x="275" y="85" width="125" height="75" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)"/>
      <path d="M 295,135 L 315,115 L 335,125 L 365,105" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  
  <rect x="85" y="280" width="160" height="30" rx="15" fill="#172554" stroke="#3b82f6"/>
  <text x="100" y="300" fill="#bfdbfe" font-size="12" font-family="sans-serif" font-weight="bold">Portfolio &amp; Web</text>
</svg>
