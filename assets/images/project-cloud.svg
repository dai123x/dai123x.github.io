<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="domainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#cloudBg)"/>

  <!-- Code/Browser Window Mockup -->
  <g transform="translate(60, 50)" filter="url(#shadowFilter)">
    <rect width="480" height="260" rx="16" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="480" height="42" rx="16" fill="#1e293b"/>
    <rect y="30" width="480" height="12" fill="#1e293b"/>
    
    <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="44" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="5.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="110" y="9" width="260" height="24" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.06)"/>
    <text x="140" y="25" fill="#94a3b8" font-size="11" font-family="monospace">https://daixuan.cloud</text>
    <circle cx="125" cy="21" r="3" fill="#10b981"/>

    <!-- Code & UI Content -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="160" height="20" rx="4" fill="url(#domainGrad)" opacity="0.8"/>
      <rect x="0" y="32" width="240" height="10" rx="4" fill="#334155"/>
      <rect x="0" y="52" width="180" height="10" rx="4" fill="#334155"/>
      <rect x="0" y="72" width="210" height="10" rx="4" fill="#334155"/>

      <!-- Right Side Bento elements -->
      <rect x="270" y="0" width="150" height="70" rx="10" fill="#1e293b" stroke="rgba(99,102,241,0.3)"/>
      <circle cx="295" cy="25" r="10" fill="#6366f1" opacity="0.4"/>
      <rect x="315" y="20" width="80" height="10" rx="4" fill="#cbd5e1"/>
      <rect x="295" y="45" width="100" height="8" rx="4" fill="#64748b"/>

      <rect x="270" y="85" width="150" height="60" rx="10" fill="#1e293b" stroke="rgba(168,85,247,0.3)"/>
      <rect x="295" y="105" width="60" height="10" rx="4" fill="#e2e8f0"/>
      <rect x="295" y="125" width="90" height="8" rx="4" fill="#64748b"/>

      <!-- Lower CTA buttons -->
      <rect x="0" y="105" width="90" height="30" rx="8" fill="#6366f1"/>
      <rect x="105" y="105" width="90" height="30" rx="8" fill="#334155"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="380" y="275" width="140" height="30" rx="15" fill="#312e81" stroke="#818cf8"/>
  <text x="400" y="295" fill="#e0e7ff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">⚡ GitHub Pages</text>
</svg>
