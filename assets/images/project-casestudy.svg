<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="caseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#caseBg)"/>

  <!-- Statistical Chart Frame -->
  <g transform="translate(60, 45)">
    <rect width="480" height="260" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="480" height="36" rx="14" fill="#1e293b"/>
    <rect y="24" width="480" height="12" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="75" y="22" fill="#cbd5e1" font-size="11" font-family="monospace">ARIMA(1,0,1) & Line Balancing Analysis</text>

    <!-- Chart Axes -->
    <g transform="translate(45, 60)">
      <!-- Grid lines -->
      <line x1="0" y1="20" x2="380" y2="20" stroke="#334155" stroke-dasharray="3 3"/>
      <line x1="0" y1="60" x2="380" y2="60" stroke="#334155" stroke-dasharray="3 3"/>
      <line x1="0" y1="100" x2="380" y2="100" stroke="#334155" stroke-dasharray="3 3"/>
      <line x1="0" y1="140" x2="380" y2="140" stroke="#64748b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="140" stroke="#64748b" stroke-width="1.5"/>

      <!-- Control Limit 3-Sigma -->
      <line x1="0" y1="35" x2="380" y2="35" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="1.5"/>
      <text x="320" y="30" fill="#fca5a5" font-size="10">UCL (+3σ)</text>

      <!-- Time Series Wave curve -->
      <path d="M 0,90 Q 20,60 40,75 T 80,45 T 120,65 T 160,30 T 200,80 T 240,60 T 280,70 T 320,55 T 360,65" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Anomaly Point Alert -->
      <circle cx="160" cy="30" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="175" y="28" fill="#f87171" font-size="11" font-weight="bold">异常超差 (OP30)</text>

      <!-- Before vs After Balance Bar Chart on Right-Bottom -->
      <g transform="translate(180, 85)">
        <rect width="180" height="50" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
        <text x="12" y="22" fill="#94a3b8" font-size="10">产线平衡率优化</text>
        <text x="12" y="40" fill="#38bdf8" font-size="12" font-weight="bold">84.4% ➔ 92.7% (+8.3%)</text>
      </g>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="75" y="275" width="180" height="30" rx="15" fill="#312e81" stroke="#818cf8"/>
  <text x="90" y="295" fill="#e0e7ff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">📈 应用统计实战案例</text>
</svg>
