<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-label="明史资料平台封面">
  <defs>
    <linearGradient id="mgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="mgAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="mgSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="mgGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(129,140,248,0.09)" stroke-width="1"/>
    </pattern>
    <radialGradient id="mgGlow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.32)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </radialGradient>
    <radialGradient id="mgGlow2" cx="92%" cy="88%" r="60%">
      <stop offset="0%" stop-color="rgba(236,72,153,0.22)"/>
      <stop offset="100%" stop-color="rgba(236,72,153,0)"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#mgBg)"/>
  <rect width="600" height="360" fill="url(#mgGrid)"/>
  <rect width="600" height="360" fill="url(#mgGlow)"/>
  <rect width="600" height="360" fill="url(#mgGlow2)"/>

  <!-- 书脊 -->
  <g transform="translate(58,58)" opacity="0.95">
    <rect x="0" y="0" width="9" height="126" rx="2" fill="#4f46e5"/>
    <rect x="15" y="8" width="9" height="118" rx="2" fill="#7c3aed" opacity="0.8"/>
    <rect x="30" y="16" width="9" height="110" rx="2" fill="#a855f7" opacity="0.62"/>
    <rect x="45" y="24" width="9" height="102" rx="2" fill="#ec4899" opacity="0.45"/>
  </g>

  <!-- 印章 -->
  <g transform="translate(126,52)">
    <rect width="62" height="62" rx="14" fill="url(#mgSeal)"/>
    <text x="31" y="46" text-anchor="middle" font-family="Songti SC, SimSun, serif" font-size="40" font-weight="700" fill="#ffffff">明</text>
  </g>

  <!-- 标题 -->
  <text x="212" y="88" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#f8fafc" letter-spacing="1.5">明史资料平台</text>
  <text x="213" y="113" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#8494ab" letter-spacing="3.4">MING HISTORY ARCHIVE</text>

  <!-- 时间轴 -->
  <g transform="translate(58,232)">
    <line x1="0" y1="0" x2="484" y2="0" stroke="rgba(148,163,184,0.28)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="484" y2="0" stroke="url(#mgAccent)" stroke-width="1.5" opacity="0.75"/>
    <g fill="#0d1224" stroke="#818cf8" stroke-width="2.4">
      <circle cx="4" cy="0" r="6"/>
      <circle cx="86" cy="0" r="6"/>
      <circle cx="168" cy="0" r="6"/>
      <circle cx="250" cy="0" r="6"/>
      <circle cx="332" cy="0" r="6"/>
      <circle cx="414" cy="0" r="6"/>
    </g>
    <circle cx="480" cy="0" r="7" fill="#ec4899" stroke="#ec4899" stroke-width="2.4"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8494ab" text-anchor="middle">
      <text x="4" y="-16">1368</text>
      <text x="168" y="-16">1450</text>
      <text x="332" y="-16">1550</text>
      <text x="480" y="-16">1683</text>
    </g>
  </g>

  <!-- 底部信息 -->
  <g transform="translate(58,276)">
    <g font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">
      <text x="0" y="0">帝王世系 · 大事年表 · 年号纪年 · 舆图政区 · 三书对照 · 词条库</text>
    </g>
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="112" height="21" rx="10.5" fill="rgba(129,140,248,0.14)" stroke="rgba(129,140,248,0.4)" stroke-width="1"/>
      <text x="56" y="14.5" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#a5b4fc">2,953 页索引</text>
      <rect x="122" y="0" width="112" height="21" rx="10.5" fill="rgba(236,72,153,0.12)" stroke="rgba(236,72,153,0.36)" stroke-width="1"/>
      <text x="178" y="14.5" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#f9a8d4">272 条词条</text>
      <rect x="244" y="0" width="150" height="21" rx="10.5" fill="rgba(34,211,238,0.11)" stroke="rgba(34,211,238,0.34)" stroke-width="1"/>
      <text x="319" y="14.5" text-anchor="middle" font-family="-apple-system, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#67e8f9">本地阅读 · 文件不上传</text>
    </g>
  </g>
</svg>
