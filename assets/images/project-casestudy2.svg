<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg2)"/>

  <!-- Background Dots -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="rgba(255,255,255,0.03)" cx="2" cy="2" r="1.5"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#dots)"/>

  <!-- Main Card -->
  <g transform="translate(70, 50)">
    <!-- Card Base -->
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-size="12" font-family="monospace">credit_risk_evaluation.dml</text>

    <!-- UI Elements -->
    <g transform="translate(30, 70)">
      <!-- Left: Survival Curve -->
      <g>
        <rect width="240" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
        <!-- Axes -->
        <line x1="30" y1="20" x2="30" y2="130" stroke="#334155" stroke-width="1.5"/>
        <line x1="30" y1="130" x2="220" y2="130" stroke="#334155" stroke-width="1.5"/>
        
        <!-- Step Curve (Kaplan Meier / Cox) -->
        <path d="M 30,30 L 60,30 L 60,45 L 90,45 L 90,65 L 120,65 L 120,95 L 160,95 L 160,110 L 210,110" fill="none" stroke="#10b981" stroke-width="2.5"/>
        <path d="M 30,40 L 70,40 L 70,65 L 110,65 L 110,105 L 140,105 L 140,120 L 210,120" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 4"/>
        
        <text x="40" y="20" fill="#cbd5e1" font-size="10" font-family="sans-serif">Survival Prob S(t)</text>
      </g>
      
      <!-- Right: DML Causal Tree/Metrics -->
      <g transform="translate(260, 0)">
        <rect width="140" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
        
        <!-- Metric 1 -->
        <text x="15" y="30" fill="#94a3b8" font-size="10" font-family="sans-serif">DML Treatment Effect</text>
        <text x="15" y="55" fill="#38bdf8" font-size="20" font-weight="bold">-4.18%</text>
        <text x="85" y="55" fill="#10b981" font-size="10">p&lt;0.05</text>
        
        <!-- Divider -->
        <line x1="15" y1="75" x2="125" y2="75" stroke="#1e293b"/>
        
        <!-- Metric 2 -->
        <text x="15" y="100" fill="#94a3b8" font-size="10" font-family="sans-serif">Model AUC</text>
        <text x="15" y="125" fill="#f43f5e" font-size="20" font-weight="bold">0.915</text>
        <path d="M 75,120 L 85,110 L 95,115 L 115,100" fill="none" stroke="#10b981" stroke-width="2"/>
      </g>
    </g>
  </g>
  
  <rect x="85" y="280" width="160" height="30" rx="15" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="105" y="300" fill="#bae6fd" font-size="12" font-family="sans-serif" font-weight="bold">Financial Analytics</text>
</svg>
