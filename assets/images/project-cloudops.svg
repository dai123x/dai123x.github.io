<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg_cloud)"/>
  <pattern id="dots_cloud" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="rgba(255,255,255,0.03)" cx="2" cy="2" r="1.5"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#dots_cloud)"/>

  <g transform="translate(70, 50)">
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-size="12" font-family="monospace">cloud_ops_dashboard.db</text>

    <!-- Cloud Ops UI -->
    <g transform="translate(30, 70)">
      <!-- Server Racks -->
      <g>
        <rect width="120" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
        <!-- Server 1 -->
        <rect x="15" y="20" width="90" height="25" rx="4" fill="#1e293b" stroke="#3b82f6"/>
        <circle cx="30" cy="32.5" r="3" fill="#10b981"/>
        <line x1="45" y1="32.5" x2="90" y2="32.5" stroke="#334155" stroke-width="2"/>
        
        <!-- Server 2 -->
        <rect x="15" y="60" width="90" height="25" rx="4" fill="#1e293b" stroke="#3b82f6"/>
        <circle cx="30" cy="72.5" r="3" fill="#10b981"/>
        <line x1="45" y1="72.5" x2="70" y2="72.5" stroke="#334155" stroke-width="2"/>

        <!-- Server 3 (Offline) -->
        <rect x="15" y="100" width="90" height="25" rx="4" fill="#1e293b" stroke="#ef4444"/>
        <circle cx="30" cy="112.5" r="3" fill="#ef4444"/>
        <line x1="45" y1="112.5" x2="80" y2="112.5" stroke="#334155" stroke-width="2"/>
      </g>
      
      <!-- Chart -->
      <g transform="translate(140, 0)">
        <rect width="260" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
        <text x="20" y="25" fill="#cbd5e1" font-size="11" font-family="sans-serif">GPU Cost Optimization (A100/H100)</text>
        
        <!-- Bars -->
        <rect x="20" y="110" width="30" height="20" rx="2" fill="#334155"/>
        <rect x="60" y="80" width="30" height="50" rx="2" fill="#334155"/>
        <rect x="100" y="50" width="30" height="80" rx="2" fill="#334155"/>
        <rect x="140" y="90" width="30" height="40" rx="2" fill="url(#barGrad)"/>
        <rect x="180" y="100" width="30" height="30" rx="2" fill="url(#barGrad)"/>
        <rect x="220" y="120" width="30" height="10" rx="2" fill="url(#barGrad)"/>
        
        <path d="M 35,100 L 75,70 L 115,40 L 155,80 L 195,90 L 235,110" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="145" y="65" fill="#10b981" font-size="10" font-weight="bold">-45% Cost</text>
      </g>
    </g>
  </g>
  
  <rect x="85" y="280" width="160" height="30" rx="15" fill="#3b0764" stroke="#d946ef"/>
  <text x="100" y="300" fill="#fbcfe8" font-size="12" font-family="sans-serif" font-weight="bold">Cloud Ops &amp; GPU</text>
</svg>
