<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="opsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#opsBg)"/>

  <!-- Architecture Flow Pipeline Box -->
  <g transform="translate(60, 45)">
    <rect width="480" height="260" rx="14" fill="#064e3b" opacity="0.4" stroke="#059669" stroke-width="1.5"/>

    <!-- Nodes Pipeline -->
    <!-- Node 1: GPU/CPU Cluster -->
    <rect x="25" y="30" width="120" height="60" rx="8" fill="#042f2e" stroke="#10b981"/>
    <text x="40" y="55" fill="#a7f3d0" font-size="12" font-weight="700">GPU/CPU 集群</text>
    <text x="40" y="75" fill="#6ee7b7" font-size="10">算力监控数据流</text>

    <!-- Arrow 1 -->
    <line x1="145" y1="60" x2="175" y2="60" stroke="#34d399" stroke-width="2"/>
    <polygon points="175,56 182,60 175,64" fill="#34d399"/>

    <!-- Node 2: SQLite / SQL -->
    <rect x="182" y="30" width="115" height="60" rx="8" fill="#042f2e" stroke="#10b981"/>
    <text x="198" y="55" fill="#a7f3d0" font-size="12" font-weight="700">SQLite / SQL</text>
    <text x="198" y="75" fill="#6ee7b7" font-size="10">多维聚合查询</text>

    <!-- Arrow 2 -->
    <line x1="297" y1="60" x2="327" y2="60" stroke="#34d399" stroke-width="2"/>
    <polygon points="327,56 334,60 327,64" fill="#34d399"/>

    <!-- Node 3: Python pandas -->
    <rect x="334" y="30" width="120" height="60" rx="8" fill="#042f2e" stroke="#10b981"/>
    <text x="345" y="55" fill="#a7f3d0" font-size="12" font-weight="700">Python pandas</text>
    <text x="345" y="75" fill="#6ee7b7" font-size="10">低利用率精准识别</text>

    <!-- Bottom Chart: Cost Optimization Bars -->
    <g transform="translate(30, 110)">
      <rect width="420" height="130" rx="8" fill="#022c22" stroke="rgba(16,185,129,0.2)"/>
      <text x="20" y="25" fill="#ecfdf5" font-size="12" font-weight="600">📊 算力利用率分布与降本规划</text>
      
      <!-- Bars -->
      <rect x="40" y="80" width="30" height="35" rx="3" fill="#f43f5e" opacity="0.8"/>
      <text x="42" y="72" fill="#fca5a5" font-size="9">闲置 28%</text>
      
      <rect x="100" y="55" width="30" height="60" rx="3" fill="#f59e0b" opacity="0.8"/>
      <text x="102" y="47" fill="#fcd34d" font-size="9">中载 45%</text>

      <rect x="160" y="40" width="30" height="75" rx="3" fill="url(#emeraldBar)"/>
      <text x="162" y="32" fill="#6ee7b7" font-size="9">高载 85%</text>

      <!-- Right Recommendation Box -->
      <rect x="220" y="38" width="180" height="75" rx="6" fill="#064e3b" stroke="#34d399" stroke-dasharray="3 3"/>
      <text x="235" y="58" fill="#d1fae5" font-size="11" font-weight="600">🎯 降本增效策略：</text>
      <text x="235" y="78" fill="#a7f3d0" font-size="10">• 弹性缩容低效实例</text>
      <text x="235" y="96" fill="#a7f3d0" font-size="10">• 混合调度预估节省 ~32%</text>
    </g>
  </g>
</svg>
