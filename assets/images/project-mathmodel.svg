<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="texBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="texAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#texBg)"/>

  <!-- Document / Overleaf IDE Layout -->
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="480" height="38" rx="14" fill="#1e293b"/>
    <rect y="26" width="480" height="12" fill="#1e293b"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="5" fill="#10b981"/>
    <text x="80" y="23" fill="#cbd5e1" font-size="12" font-family="monospace">MathModel.tex - Overleaf (XeLaTeX)</text>

    <!-- Code Editor Section -->
    <g transform="translate(24, 55)">
      <text x="0" y="18" fill="#38bdf8" font-size="13" font-family="monospace">\documentclass{gmcmthesis}</text>
      <text x="0" y="40" fill="#a78bfa" font-size="13" font-family="monospace">\usepackage{amsmath, amssymb}</text>
      <text x="0" y="62" fill="#94a3b8" font-size="13" font-family="monospace">% “华为杯”第二十三届研究生数学建模竞赛</text>
      <text x="0" y="84" fill="#f43f5e" font-size="13" font-family="monospace">\title{基于高阶统计与动态规划的算力调度}</text>
      <text x="0" y="106" fill="#38bdf8" font-size="13" font-family="monospace">\begin{document}</text>
      <text x="20" y="128" fill="#e2e8f0" font-size="13" font-family="monospace">\maketitle</text>
      <text x="20" y="150" fill="#64748b" font-size="13" font-family="monospace">\section{问题重述与数据预处理}</text>
      <text x="0" y="172" fill="#38bdf8" font-size="13" font-family="monospace">\end{document}</text>
    </g>

    <!-- Document PDF Preview on Right -->
    <g transform="translate(320, 52)">
      <rect width="135" height="180" rx="6" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))"/>
      <rect x="15" y="15" width="105" height="8" rx="2" fill="#1e293b"/>
      <line x1="15" y1="35" x2="120" y2="35" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="15" y1="45" x2="105" y2="45" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="15" y1="55" x2="115" y2="55" stroke="#e2e8f0" stroke-width="2"/>
      
      <!-- Formula Mockup -->
      <rect x="25" y="70" width="85" height="24" rx="4" fill="#f1f5f9"/>
      <text x="35" y="86" fill="#0f172a" font-size="11" font-family="serif" font-style="italic">f(x) = \sum w_i x_i</text>
      
      <line x1="15" y1="108" x2="120" y2="108" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="15" y1="118" x2="95" y2="118" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="15" y1="128" x2="110" y2="128" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="15" y1="138" x2="80" y2="138" stroke="#e2e8f0" stroke-width="2"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="75" y="275" width="170" height="30" rx="15" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="90" y="295" fill="#dbeafe" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">⭐ 华为杯研数模 LaTeX</text>
</svg>
