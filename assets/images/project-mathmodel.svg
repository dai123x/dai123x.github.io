<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_math" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="texGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg_math)"/>
  <pattern id="dots_math" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="rgba(255,255,255,0.03)" cx="2" cy="2" r="1.5"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#dots_math)"/>

  <g transform="translate(70, 50)">
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Code Editor UI -->
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-size="12" font-family="monospace">main.tex - LaTeX Template</text>

    <g transform="translate(30, 70)">
      <!-- Editor Sidebar -->
      <rect width="100" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
      <rect x="15" y="20" width="70" height="6" rx="3" fill="#334155"/>
      <rect x="15" y="40" width="50" height="6" rx="3" fill="#334155"/>
      <rect x="15" y="60" width="80" height="6" rx="3" fill="#38bdf8"/>
      <rect x="15" y="80" width="60" height="6" rx="3" fill="#334155"/>
      <rect x="15" y="100" width="40" height="6" rx="3" fill="#334155"/>

      <!-- Editor Window -->
      <g transform="translate(120, 0)">
        <rect width="280" height="150" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
        <!-- TeX Code -->
        <text x="20" y="30" fill="#f472b6" font-size="11" font-family="monospace">\documentclass<tspan fill="#e2e8f0">{</tspan><tspan fill="#a3e635">cumcmart</tspan><tspan fill="#e2e8f0">}</tspan></text>
        <text x="20" y="55" fill="#38bdf8" font-size="11" font-family="monospace">\usepackage<tspan fill="#e2e8f0">{</tspan><tspan fill="#a3e635">amsmath, graphicx</tspan><tspan fill="#e2e8f0">}</tspan></text>
        <text x="20" y="80" fill="#f472b6" font-size="11" font-family="monospace">\begin<tspan fill="#e2e8f0">{</tspan><tspan fill="#a3e635">document</tspan><tspan fill="#e2e8f0">}</tspan></text>
        <text x="35" y="105" fill="#94a3b8" font-size="11" font-family="monospace">% Mathematical Modeling 2026</text>
        <text x="35" y="130" fill="#e2e8f0" font-size="11" font-family="monospace">E = mc^2 \int_0^\infty e^{-x^2} dx</text>
      </g>
    </g>
  </g>
  
  <rect x="85" y="280" width="120" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="100" y="300" fill="#c7d2fe" font-size="12" font-family="sans-serif" font-weight="bold">LaTeX &amp; TeX</text>
</svg>
