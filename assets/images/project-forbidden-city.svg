<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_palace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1614"/>
      <stop offset="50%" stop-color="#2d1b18"/>
      <stop offset="100%" stop-color="#140e0d"/>
    </linearGradient>
    <linearGradient id="gold_roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c862"/>
      <stop offset="40%" stop-color="#dfa22e"/>
      <stop offset="100%" stop-color="#aa6f16"/>
    </linearGradient>
    <linearGradient id="red_wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8382c"/>
      <stop offset="100%" stop-color="#7a1e16"/>
    </linearGradient>
    <linearGradient id="marble_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#d4c9b6"/>
    </linearGradient>
    <pattern id="cloud_pat" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M20 40 Q30 25 45 35 Q55 20 70 35 Q80 45 65 55 Q50 65 35 55 Q20 65 10 50 Z" fill="none" stroke="rgba(223, 162, 46, 0.05)" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg_palace)"/>
  <rect width="800" height="500" fill="url(#cloud_pat)"/>

  <!-- Outer Traditional Framing Border -->
  <rect x="25" y="25" width="750" height="450" rx="12" fill="none" stroke="#dfa22e" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="33" y="33" width="734" height="434" rx="8" fill="none" stroke="#dfa22e" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(400, 240)">
    <!-- Sun / Moon Aura -->
    <circle cx="0" cy="-60" r="140" fill="#dfa22e" fill-opacity="0.08"/>
    <circle cx="0" cy="-60" r="110" fill="#dfa22e" fill-opacity="0.12"/>

    <!-- Three-tier Marble San-Tai Plinth -->
    <path d="M-220 160 L220 160 L240 185 L-240 185 Z" fill="url(#marble_grad)"/>
    <path d="M-190 135 L190 135 L205 160 L-205 160 Z" fill="url(#marble_grad)"/>
    <path d="M-160 110 L160 110 L175 135 L-175 135 Z" fill="url(#marble_grad)"/>

    <!-- Dragon Ramp in Center -->
    <path d="M-28 110 L28 110 L38 185 L-38 185 Z" fill="#c4b8a4" stroke="#aa9c86" stroke-width="1"/>

    <!-- Hall of Supreme Harmony Body (Red Pillars & Doors) -->
    <rect x="-130" y="45" width="260" height="65" fill="url(#red_wall)"/>
    <g fill="#dfa22e" opacity="0.6">
      <rect x="-105" y="55" width="24" height="55"/>
      <rect x="-70" y="55" width="24" height="55"/>
      <rect x="-35" y="55" width="24" height="55"/>
      <rect x="11" y="55" width="24" height="55"/>
      <rect x="46" y="55" width="24" height="55"/>
      <rect x="81" y="55" width="24" height="55"/>
    </g>

    <!-- Lower Eaves (重檐下檐) -->
    <path d="M-175 45 Q-140 38 -90 40 L90 40 Q140 38 175 45 L150 20 L-150 20 Z" fill="url(#gold_roof)"/>
    <path d="M-180 46 C-150 36 -100 37 -60 38 L60 38 C100 37 150 36 180 46" fill="none" stroke="#f5c862" stroke-width="2.5"/>

    <!-- Upper Hall Body & Dougong -->
    <rect x="-105" y="-10" width="210" height="30" fill="url(#red_wall)"/>

    <!-- Upper Eaves (重檐庑殿大顶) -->
    <path d="M-210 -10 Q-150 -25 -70 -20 L70 -20 Q150 -25 210 -10 L130 -85 L-130 -85 Z" fill="url(#gold_roof)"/>
    <path d="M-218 -8 C-160 -26 -90 -22 -40 -20 L40 -20 C90 -22 160 -26 218 -8" fill="none" stroke="#f5c862" stroke-width="3"/>

    <!-- Main Ridge (正脊) & Ridge Beasts -->
    <rect x="-70" y="-92" width="140" height="9" rx="3" fill="#f5c862"/>
    <circle cx="-68" cy="-94" r="5" fill="#f5c862"/>
    <circle cx="68" cy="-94" r="5" fill="#f5c862"/>
  </g>

  <!-- Typography & Seals -->
  <g transform="translate(60, 95)">
    <text font-family="'KaiTi', 'STKaiti', 'SimSun', serif" font-size="34" font-weight="bold" fill="#fbf5e6" letter-spacing="4">紫禁城</text>
    <text y="38" font-family="'KaiTi', 'STKaiti', 'SimSun', serif" font-size="18" fill="#dfa22e" letter-spacing="2">故宫全景水墨淡彩图志</text>
    <rect y="56" width="280" height="2" fill="#dfa22e" fill-opacity="0.4"/>
    <text y="82" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#a4968c" letter-spacing="1">1:1 实测级还原 · 纯原生水墨淡彩渲染引擎</text>
    <text y="104" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#a4968c" letter-spacing="1">中轴三大殿 · 后三宫 · 东西六宫 · 筒子河角楼</text>
  </g>

  <!-- Seal Stamp Badge (Top Right) -->
  <g transform="translate(710, 85)">
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#a63428" stroke="#8b261c" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'STKaiti', 'KaiTi', serif" font-size="14" font-weight="bold" fill="#f5eede" text-anchor="middle">金銮</text>
    <text x="0" y="17" font-family="'STKaiti', 'KaiTi', serif" font-size="14" font-weight="bold" fill="#f5eede" text-anchor="middle">九五</text>
  </g>
</svg>
