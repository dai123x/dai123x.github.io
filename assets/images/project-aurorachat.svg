<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="aurora_ac" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="user_ac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow_ac" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg_ac)"/>
  <pattern id="grid_ac" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34, 211, 238, 0.08)" stroke-width="1"/>
  </pattern>
  <rect width="600" height="360" fill="url(#grid_ac)"/>

  <!-- 极光光幕 -->
  <g filter="url(#glow_ac)">
    <path d="M-20 140 Q 90 55 205 125 T 425 100 T 630 60" stroke="url(#aurora_ac)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M-20 185 Q 115 95 235 155 T 465 140 T 630 100" stroke="url(#aurora_ac)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.38"/>
  </g>

  <!-- 聊天窗口 -->
  <g transform="translate(90, 62)">
    <rect width="420" height="256" rx="16" fill="#1e293b" fill-opacity="0.94" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
    <rect width="420" height="38" rx="16" fill="#0f172a" fill-opacity="0.6"/>
    <rect y="22" width="420" height="16" fill="#0f172a" fill-opacity="0.6"/>
    <circle cx="22" cy="19" r="5" fill="#34d399" opacity="0.9"/>
    <circle cx="40" cy="19" r="5" fill="#22d3ee" opacity="0.9"/>
    <circle cx="58" cy="19" r="5" fill="#818cf8" opacity="0.9"/>
    <rect x="340" y="9" width="66" height="20" rx="10" fill="url(#aurora_ac)" opacity="0.95"/>
    <text x="373" y="23" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#04231c" text-anchor="middle">对比模式</text>

    <!-- 用户消息 -->
    <rect x="212" y="52" width="188" height="34" rx="10" fill="url(#user_ac)" opacity="0.92"/>
    <rect x="226" y="62" width="118" height="6" rx="3" fill="#04231c" opacity="0.75"/>
    <rect x="226" y="73" width="78" height="6" rx="3" fill="#04231c" opacity="0.5"/>

    <!-- 助手回复：思考过程 + 正文 -->
    <rect x="20" y="98" width="188" height="52" rx="10" fill="#0f172a" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
    <rect x="32" y="108" width="96" height="6" rx="3" fill="#34d399" opacity="0.55"/>
    <rect x="32" y="121" width="150" height="6" rx="3" fill="rgba(148,163,184,0.55)"/>
    <rect x="32" y="133" width="112" height="6" rx="3" fill="rgba(148,163,184,0.4)"/>

    <!-- 双模型对比列 -->
    <rect x="20" y="162" width="188" height="42" rx="10" fill="#0f172a" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
    <rect x="20" y="162" width="188" height="5" rx="2.5" fill="#34d399"/>
    <text x="34" y="184" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#34d399">A</text>
    <rect x="52" y="176" width="120" height="6" rx="3" fill="rgba(148,163,184,0.5)"/>
    <rect x="34" y="190" width="88" height="6" rx="3" fill="rgba(148,163,184,0.35)"/>

    <rect x="212" y="162" width="188" height="42" rx="10" fill="#0f172a" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
    <rect x="212" y="162" width="188" height="5" rx="2.5" fill="#818cf8"/>
    <text x="226" y="184" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#818cf8">B</text>
    <rect x="244" y="176" width="120" height="6" rx="3" fill="rgba(148,163,184,0.5)"/>
    <rect x="226" y="190" width="88" height="6" rx="3" fill="rgba(148,163,184,0.35)"/>

    <!-- 投票栏 -->
    <rect x="130" y="216" width="50" height="18" rx="9" fill="rgba(52,211,153,0.18)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
    <rect x="185" y="216" width="50" height="18" rx="9" fill="rgba(148,163,184,0.1)" stroke="rgba(148,163,184,0.3)" stroke-width="1"/>
    <rect x="240" y="216" width="50" height="18" rx="9" fill="rgba(129,140,248,0.18)" stroke="rgba(129,140,248,0.5)" stroke-width="1"/>
  </g>
</svg>
