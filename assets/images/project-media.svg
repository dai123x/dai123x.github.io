<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_agv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="agvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg_agv)"/>
  <pattern id="grid_agv" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(245, 158, 11, 0.05)" stroke-width="1"/>
  </pattern>
  <rect x="0" y="0" width="600" height="360" fill="url(#grid_agv)"/>

  <g transform="translate(70, 50)">
    <rect width="460" height="260" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="460" height="40" rx="16" fill="#0f172a" fill-opacity="0.5"/>
    <rect y="24" width="460" height="16" fill="#0f172a" fill-opacity="0.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-size="12" font-family="monospace">agv_fleet_routing.sim</text>

    <!-- Factory Floor Map -->
    <g transform="translate(30, 60)">
      <rect width="400" height="170" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
      
      <!-- Workstations -->
      <rect x="40" y="30" width="60" height="40" rx="4" fill="#334155"/>
      <rect x="40" y="100" width="60" height="40" rx="4" fill="#334155"/>
      <rect x="300" y="30" width="60" height="40" rx="4" fill="#334155"/>
      <rect x="300" y="100" width="60" height="40" rx="4" fill="#334155"/>
      
      <!-- Routing Paths -->
      <path d="M 100,50 L 150,50 L 150,120 L 300,120" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M 100,120 L 250,120 L 250,50 L 300,50" fill="none" stroke="#f59e0b" stroke-width="3"/>
      
      <!-- AGV Robots -->
      <!-- AGV 1 -->
      <g transform="translate(180, 120)">
        <rect x="-10" y="-8" width="20" height="16" rx="2" fill="url(#agvGrad)"/>
        <circle cx="0" cy="0" r="3" fill="#1e293b"/>
      </g>
      
      <!-- AGV 2 -->
      <g transform="translate(250, 80)">
        <rect x="-10" y="-8" width="20" height="16" rx="2" fill="url(#agvGrad)"/>
        <circle cx="0" cy="0" r="3" fill="#1e293b"/>
      </g>

      <!-- Nodes -->
      <circle cx="150" cy="50" r="4" fill="#94a3b8"/>
      <circle cx="150" cy="120" r="4" fill="#94a3b8"/>
      <circle cx="250" cy="120" r="4" fill="#f59e0b"/>
      <circle cx="250" cy="50" r="4" fill="#f59e0b"/>
    </g>
  </g>
  
  <rect x="85" y="280" width="180" height="30" rx="15" fill="#451a03" stroke="#f59e0b"/>
  <text x="100" y="300" fill="#fde68a" font-size="12" font-family="sans-serif" font-weight="bold">Industrial Engineering</text>
</svg>
