<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mediaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#mediaBg)"/>

  <!-- Timeline track & Video waveform illustration -->
  <g transform="translate(60, 60)">
    <!-- Video Player Screen -->
    <rect width="480" height="170" rx="14" fill="#030712" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Play button overlay -->
    <circle cx="240" cy="85" r="32" fill="url(#roseGrad)" opacity="0.9"/>
    <polygon points="233,71 254,85 233,99" fill="#ffffff"/>

    <!-- Dynamic Audio Waveform -->
    <g transform="translate(40, 195)">
      <rect x="0" y="20" width="400" height="50" rx="8" fill="#111827" stroke="#374151"/>
      <line x1="20" y1="45" x2="20" y2="35" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="45" x2="40" y2="25" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="45" x2="60" y2="40" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="45" x2="80" y2="20" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="100" y1="45" x2="100" y2="30" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="120" y1="45" x2="120" y2="15" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="140" y1="45" x2="140" y2="35" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="160" y1="45" x2="160" y2="25" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="180" y1="45" x2="180" y2="42" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="200" y1="45" x2="200" y2="18" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="220" y1="45" x2="220" y2="32" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="240" y1="45" x2="240" y2="22" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="260" y1="45" x2="260" y2="38" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="280" y1="45" x2="280" y2="15" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="300" y1="45" x2="300" y2="28" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="320" y1="45" x2="320" y2="36" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <line x1="340" y1="45" x2="340" y2="22" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="360" y1="45" x2="360" y2="40" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="380" y1="45" x2="380" y2="30" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="70" y="275" width="130" height="30" rx="15" fill="#4c0519" stroke="#f43f5e"/>
  <text x="85" y="295" fill="#fecdd3" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">🎬 视频剪辑与矩阵</text>
</svg>
