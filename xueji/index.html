<style>
:root{
  --bg:#070b14; --bg2:#0a1020; --card:#0f1826; --card2:#141f31; --line:#1d2a3f; --line2:#26354c;
  --text:#e8eef7; --muted:#8ea0b8; --dim:#5d6e85;
  --accent:#4f8cff; --teal:#2dd4bf; --green:#35c98a; --amber:#f0b849; --red:#f0616d; --purple:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --r:14px; --r-sm:10px;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#eef2f9; --card:#ffffff; --card2:#f7f9fd; --line:#e2e8f2; --line2:#d3dcea;
  --text:#101c2c; --muted:#5b6b80; --dim:#8494a8;
  --shadow:0 1px 2px rgba(16,28,44,.05),0 10px 28px -18px rgba(16,28,44,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:rgba(79,140,255,.28)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(135deg,#4f8cff,#7b6cf6);
  display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
  box-shadow:0 6px 18px -8px rgba(79,140,255,.9);
}
.brand-txt b{display:block;font-size:16px;letter-spacing:.06em}
.brand-txt span{display:block;font-size:11px;color:var(--dim);letter-spacing:.02em}
.nav-group{font-size:10.5px;color:var(--dim);letter-spacing:.14em;padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  color:var(--muted);font-size:13.5px;transition:background .14s,color .14s;
}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.on{background:rgba(79,140,255,.14);color:#a9c6ff;font-weight:600}
html[data-theme="light"] .nav-item.on{background:rgba(79,140,255,.12);color:#2b62c9}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11px;color:var(--dim);line-height:1.7}
.rail-foot b{color:var(--green);font-weight:600}

.main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1280px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:22px;letter-spacing:-.01em}
.topbar p{font-size:12.5px;color:var(--dim);margin-top:3px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{
  padding:7px 13px;border-radius:8px;border:1px solid var(--line2);
  background:var(--card);font-size:12.5px;color:var(--muted);transition:.14s;
}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,#4f8cff,#6a7cf7);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}

/* ---------- grid & cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);min-width:0;
}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:13.5px;font-weight:650;letter-spacing:.01em}
.card-h .hint{font-size:11.5px;color:var(--dim)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

/* ---------- stat ---------- */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .v small{font-size:13px;color:var(--dim);font-weight:500;margin-left:2px}
.stat .s{font-size:11.5px;color:var(--muted)}
.big{font-size:46px;font-weight:750;letter-spacing:-.03em;line-height:1}
.big small{font-size:15px;color:var(--dim);font-weight:500;margin-left:4px}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:600;line-height:1.7;
}
.pill.green{background:rgba(53,201,138,.14);color:var(--green)}
.pill.amber{background:rgba(240,184,73,.14);color:var(--amber)}
.pill.red{background:rgba(240,97,109,.14);color:var(--red)}
.pill.blue{background:rgba(79,140,255,.14);color:#7fa9ff}
.pill.teal{background:rgba(45,212,191,.14);color:var(--teal)}
.pill.dim{background:rgba(93,110,133,.16);color:var(--muted)}
html[data-theme="light"] .pill.blue{color:#2b62c9}

/* ---------- bars ---------- */
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4f8cff,#7b6cf6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--dim);
  padding:7px 8px;border-bottom:1px solid var(--line);letter-spacing:.03em;white-space:nowrap;
}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;
  background:rgba(79,140,255,.13);color:#8fb4ff;font-weight:600;white-space:nowrap;
}
html[data-theme="light"] .tag{color:#2b62c9}

/* ---------- list ---------- */
.li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none;padding-bottom:0}
.li:first-child{padding-top:0}
.li-body{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}

/* ---------- inputs ---------- */
.inp{
  width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--text);font-size:13px;outline:none;transition:.14s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.14)}
.inp.sm{width:74px;padding:4px 8px;font-size:12.5px;text-align:right}
.inp.ghost{background:transparent;border-color:transparent;width:58px;padding:4px 6px}
.inp.ghost:hover{border-color:var(--line2);background:var(--bg2)}
.inp.ghost:focus{background:var(--bg2)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--dim)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;border-radius:999px;
  background:var(--line2);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

/* ---------- eval dims ---------- */
.dim{padding:13px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:none;padding-bottom:0}
.dim-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.dim-h b{font-size:13.5px}
.dim-items{display:grid;gap:7px;grid-template-columns:repeat(3,minmax(0,1fr))}
.dim-item{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.dim-item span{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim-item input{width:52px;background:transparent;border:none;text-align:right;font-size:13px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.dim-item input:focus{color:var(--accent)}

/* ---------- charts ---------- */
.barchart{display:flex;gap:8px;align-items:stretch}
.bc-col{flex:1;min-width:0;display:flex;flex-direction:column}
.bc-plot{
  flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);
  background-size:100% 25%;background-position:0 100%;
}
.bc-bar{width:min(44px,58%);border-radius:5px 5px 0 0;min-height:3px}
.bc-val{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:650;line-height:1}
.bc-lab{font-size:11px;color:var(--dim);text-align:center;padding-top:7px;line-height:1.35;height:36px;overflow:hidden}
.chart{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---------- misc ---------- */
.note{
  border-left:3px solid var(--amber);background:rgba(240,184,73,.08);
  padding:9px 12px;border-radius:0 8px 8px 0;font-size:12px;color:var(--muted);line-height:1.7;
}
.note b{color:var(--amber);font-weight:600}
.empty{color:var(--dim);font-size:12.5px;padding:18px 0;text-align:center}
.tabbar{display:none}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:#1a2436;color:#e8eef7;border:1px solid var(--line2);
  padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:.22s;z-index:99;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  .c3{grid-column:span 6}.c4{grid-column:span 6}.c5{grid-column:span 12}
  .c6{grid-column:span 12}.c7{grid-column:span 12}.c8{grid-column:span 12}
}
@media (max-width:820px){
  .rail{display:none}
  .main{padding:18px 14px 92px}
  .grid{gap:11px}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .topbar h1{font-size:19px}
  .big{font-size:38px}
  .dim-items{grid-template-columns:1fr 1fr}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(10,16,32,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  html[data-theme="light"] .tabbar{background:rgba(255,255,255,.94)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--dim);padding:3px 0}
  .tabbar a.on{color:var(--accent)}
  .tabbar svg{width:19px;height:19px}
}
</style>
</head>

/* ============================================================
   1. 计算引擎（纯函数）
   ============================================================ */
const EPS = 1e-9;
const isNum = v => typeof v === 'number' && Number.isFinite(v);
function num(v){ if(v===null||v===undefined||v==='') return null; const n=Number(v); return Number.isFinite(n)?n:null; }
function round(v,d=2){ if(!isNum(v)) return null; const f=Math.pow(10,d); return Math.round((v+EPS)*f)/f; }
function fx(v,d=2){ const n=num(v); return isNum(n)? n.toFixed(d) : '—'; }
const clamp = (v,lo,hi)=>Math.min(hi,Math.max(lo,v));

function scoreToGp(score, mode){
  const s = num(score);
  if(!isNum(s) || s<0 || s>100) return null;
  if(mode==='pct') return s;
  if(mode==='five'){ if(s<60) return 0; return round(Math.min(5, s/10-5),2); }
  for(const [floor,gp] of STD4_TABLE){ if(s>=floor) return gp; }
  return 0;
}
const maxGp = mode => mode==='pct'?100 : mode==='five'?5 : 4;
const isScored  = c => !!c && isNum(num(c.score)) && c.status!=='learning';
const isCounted = c => isScored(c) && c.includeGpa!==false;
const normName = s => String(s||'').replace(/\s+/g,'').toLowerCase();

function mergeRetakes(courses){
  const g = new Map();
  for(const c of courses||[]){ if(!c) continue; const k=normName(c.name); if(!g.has(k)) g.set(k,[]); g.get(k).push(c); }
  const out=[];
  for(const list of g.values()){
    if(list.length<=1){ out.push(...list); continue; }
    if(!list.some(c=>c.retake)){ out.push(...list); continue; }
    let best=list[0];
    for(const c of list){ const a=num(c.score), b=num(best.score); if(a===null) continue; if(b===null||a>b+EPS) best=c; }
    out.push(Object.assign({},best,{_merged:true,_mergedScores:list.map(c=>num(c.score)).filter(isNum)}));
  }
  return out;
}

function summarize(courses, cfg){
  const mode = (cfg&&cfg.gpaMode)||'std4';
  const passLine = num(cfg&&cfg.passLine) ?? 60;
  const list = mergeRetakes(courses||[]);
  let gpSum=0, wtSum=0, creditSum=0, earned=0, planned=0, counted=0, passed=0, failed=0;
  const dist={'90':0,'80':0,'70':0,'60':0,fail:0};
  let best=null, worst=null;
  for(const c of list){
    const cr=num(c.credit), sc=num(c.score);
    if(isNum(cr)&&cr>0) planned+=cr;
    if(!isScored(c)) continue;
    if(sc>=passLine){ passed++; if(isNum(cr)&&cr>0) earned+=cr; } else failed++;
    if(sc>=90) dist['90']++; else if(sc>=80) dist['80']++; else if(sc>=70) dist['70']++; else if(sc>=60) dist['60']++; else dist.fail++;
    if(!best||sc>num(best.score)) best=c;
    if(!worst||sc<num(worst.score)) worst=c;
    if(!isCounted(c)) continue;
    if(!isNum(cr)||cr<=0) continue;
    const gp=scoreToGp(sc,mode);
    if(!isNum(gp)) continue;
    gpSum+=gp*cr; wtSum+=sc*cr; creditSum+=cr; counted++;
  }
  return {
    gpa: creditSum>0? round(gpSum/creditSum,2):null,
    avg: creditSum>0? round(wtSum/creditSum,2):null,
    credits: round(creditSum,1), earned: round(earned,1), planned: round(planned,1),
    counted, passed, failed, dist, best, worst, courses:list.length
  };
}

function bySemester(courses, semesters, cfg){
  const mode=(cfg&&cfg.gpaMode)||'std4';
  const rows=[]; let accGp=0, accCr=0;
  for(const sem of (semesters||[]).slice().sort((a,b)=>a.order-b.order)){
    const list=(courses||[]).filter(c=>c.semId===sem.id);
    const sum=summarize(list,cfg);
    for(const c of mergeRetakes(list)){
      if(!isCounted(c)) continue;
      const cr=num(c.credit); if(!isNum(cr)||cr<=0) continue;
      const gp=scoreToGp(c.score,mode); if(!isNum(gp)) continue;
      accGp+=gp*cr; accCr+=cr;
    }
    rows.push(Object.assign({sem},sum,{cumGpa:accCr>0?round(accGp/accCr,2):null,cumCredits:round(accCr,1)}));
  }
  return rows;
}

function rankInfo(rank,size){
  const r=num(rank), n=num(size);
  if(!isNum(r)||!isNum(n)||r<=0||n<=0||r>n) return {pct:null,topText:'—',level:'none'};
  const pct=round(r/n*100,1);
  let level='low';
  if(pct<=5) level='top'; else if(pct<=15) level='high'; else if(pct<=30) level='mid';
  return {pct,topText:'前 '+pct+'%',level};
}

function awardValue(a){
  const direct=num(a&&a.points);
  if(isNum(direct)) return Math.max(0,round(direct,1));
  const base=num(a&&a.base), lv=LEVEL_MAP[a&&a.level];
  if(!isNum(base)||!lv) return 0;
  return Math.max(0,round(base*lv.factor,1));
}

function awardSummary(awards,cfg){
  const includePending=(cfg&&cfg.includePending)!==false;
  const byCat={}, byDim={};
  let total=0,pending=0;
  for(const a of awards||[]){
    if(!a) continue;
    const v=awardValue(a); if(v<=0) continue;
    const cat=CAT_MAP[a.cat]?a.cat:'competition';
    const dim=CAT_MAP[cat].dim;
    const isP=a.status==='pending';
    if(!byCat[cat]) byCat[cat]={points:0,count:0,pending:0};
    byCat[cat].points=round(byCat[cat].points+v,1); byCat[cat].count++;
    if(isP) byCat[cat].pending=round(byCat[cat].pending+v,1);
    if(isP) pending=round(pending+v,1);
    if(isP && !includePending) continue;
    if(!byDim[dim]) byDim[dim]={points:0,count:0};
    byDim[dim].points=round(byDim[dim].points+v,1); byDim[dim].count++;
    total=round(total+v,1);
  }
  return {total:round(total,1),pending:round(pending,1),byCat,byDim,count:(awards||[]).length};
}

function evaluate(items, awards, academic, cfg){
  cfg=cfg||{};
  const aw=cfg.academicWeight??70, qw=cfg.qualityWeight??30;
  const dimWeights=cfg.dimWeights||{};
  const autoInnov=cfg.autoInnov!==false;
  const includePending=cfg.includePending!==false;
  const awardRes=awardSummary(awards,{includePending});
  const dims=[]; let wSum=0,wScoreSum=0,validDims=0;
  for(const d of EVAL_DIMS){
    const row=(items&&items[d.key])||{};
    const vals=d.items.map(it=>num(row[it.key])).filter(isNum);
    const base=vals.length? round(vals.reduce((a,b)=>a+b,0)/vals.length,2):null;
    const bonusRaw=awardRes.byDim[d.key]?awardRes.byDim[d.key].points:0;
    const bonus=(autoInnov||d.key!=='innov')?bonusRaw:0;
    let score=null;
    if(isNum(base)||bonus>0) score=round(clamp((isNum(base)?base:0)+bonus,0,100),2);
    const w=num(dimWeights[d.key]);
    const weight=(isNum(w)&&w>0)?w:0;
    const valid=isNum(score);
    if(valid){ validDims++; if(weight>0){ wSum+=weight; wScoreSum+=score*weight; } }
    dims.push({key:d.key,name:d.name,color:d.color,desc:d.desc,weight,base,bonus:round(bonus,1),score,valid,
      filled:vals.length,total:d.items.length,items:d.items,raw:row});
  }
  const quality=wSum>0? round(wScoreSum/wSum,2):null;
  const academicScore=isNum(academic)? round(academic,2):null;
  let total=null;
  if(isNum(academicScore)&&isNum(quality)) total=round((academicScore*aw+quality*qw)/(aw+qw),2);
  else if(isNum(academicScore)&&wSum===0) total=academicScore;
  else if(!isNum(academicScore)&&isNum(quality)) total=quality;
  return {
    academic:{score:academicScore,weight:aw},
    quality:{score:quality,weight:qw,dims,coverage:validDims+'/'+EVAL_DIMS.length,validDims,weightUsed:round(wSum,1)},
    awards:awardRes, total
  };
}

function scholarshipOf(pct,tiers){
  const p=num(pct); if(!isNum(p)||!Array.isArray(tiers)||!tiers.length) return null;
  for(const t of tiers.slice().sort((a,b)=>num(a.pct)-num(b.pct))){ if(p<=num(t.pct)) return t; }
  return null;
}
function postgradOf(pct,rate){
  const p=num(pct), r=num(rate)??15;
  if(!isNum(p)) return {eligible:null,pct:null,rate:r,gap:null};
  return {eligible:p<=r,pct:p,rate:r,gap:round(p-r,1)};
}
function evalLevel(s){
  const v=num(s);
  if(!isNum(v)) return {label:'未测评',cls:'dim'};
  if(v>=90) return {label:'优秀',cls:'green'};
  if(v>=80) return {label:'良好',cls:'blue'};
  if(v>=70) return {label:'中等',cls:'amber'};
  if(v>=60) return {label:'合格',cls:'teal'};
  return {label:'待提升',cls:'red'};
}
function requiredGp(accGpa,accCredits,target,left,mode){
  const g=num(accGpa),c=num(accCredits),t=num(target),l=num(left);
  if(![g,c,t,l].every(isNum)||l<=0) return null;
  const need=(t*(c+l)-g*c)/l;
  return {value:round(need,2),reachable:need<=maxGp(mode)+EPS};
}

function barChart(data, opts){
  opts=opts||{};
  const max=Math.max(opts.max||0, ...data.map(d=>d.value||0)) || 1;
  const top=max*1.1;
  return '<div class="barchart" style="height:'+(opts.h||200)+'px">'+data.map(d=>{
    const pct=clamp((d.value||0)/top*100,0,100);
    return '<div class="bc-col">'
      +'<div class="bc-plot">'
      +'<div class="bc-bar" style="height:'+pct.toFixed(1)+'%;background:'+(d.color||'#4f8cff')+'"></div>'
      +'<div class="bc-val" style="bottom:calc('+pct.toFixed(1)+'% + 6px)">'+(d.label2||'')+'</div>'
      +'</div>'
      +'<div class="bc-lab">'+esc(d.label)+'</div>'
      +'</div>';
  }).join('')+'</div>';
}

function radarChart(dims){
  const W=300,H=270,cx=W/2,cy=H/2+6,R=94;
  const n=dims.length;
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  for(let ring=1;ring<=4;ring++){
    const r=R*ring/4;
    const pts=dims.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
    s+='<polygon points="'+pts+'" fill="none" stroke="var(--line)" stroke-width="1"/>';
  }
  dims.forEach((_,i)=>{ const [x,y]=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'; });
  const pts=dims.map((d,i)=>pt(i, R*clamp((d.score||0)/100,0,1)).map(v=>v.toFixed(1)).join(',')).join(' ');
  s+='<polygon points="'+pts+'" fill="rgba(79,140,255,.20)" stroke="#4f8cff" stroke-width="2"/>';
  dims.forEach((d,i)=>{
    const [x,y]=pt(i, R*clamp((d.score||0)/100,0,1));
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="#4f8cff"/>';
    const [lx,ly]=pt(i,R+27);
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(d.name)+'</text>';
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+16).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text)">'+fx(d.score,1)+'</text>';
  });
  s+='</svg>';
  return '<div style="max-width:330px;margin:0 auto">'+s+'</div>';
}

function rankRuler(pct, tiers, rate){
  const W=520,H=118,L=16,R2=16;
  const x=p=>L+(clamp(p,0,50)/50)*(W-L-R2);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  const sorted=(tiers||[]).slice().sort((a,b)=>num(a.pct)-num(b.pct));
  let prev=0;
  sorted.forEach(t=>{
    const x0=x(prev), x1=x(t.pct), w=Math.max(1,x1-x0);
    s+='<rect x="'+x0.toFixed(1)+'" y="26" width="'+w.toFixed(1)+'" height="18" rx="4" fill="rgba(79,140,255,.16)" stroke="rgba(79,140,255,.28)" stroke-width="1"/>';
    const nm=String(t.name).replace('奖学金','');
    const lx=x0+w*(w>60?0.7:0.5);
    s+='<text x="'+lx.toFixed(1)+'" y="38.5" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+esc(nm)+'</text>';
    prev=t.pct;
  });
  if(isNum(rate)&&rate<=50){
    const rx=x(rate);
    s+='<line x1="'+rx.toFixed(1)+'" y1="20" x2="'+rx.toFixed(1)+'" y2="48" stroke="var(--teal)" stroke-width="1.4" stroke-dasharray="3 3"/>';
    s+='<text x="'+rx.toFixed(1)+'" y="15" text-anchor="middle" font-size="9.5" fill="var(--teal)">保研线 '+rate+'%</text>';
  }
  [0,5,10,15,20,25,30,35,40,45,50].forEach(m=>{
    const px=x(m);
    s+='<line x1="'+px.toFixed(1)+'" y1="48" x2="'+px.toFixed(1)+'" y2="53" stroke="var(--line2)" stroke-width="1"/>';
    if(m%10===0){
      s+='<text x="'+px.toFixed(1)+'" y="66" text-anchor="middle" font-size="9.5" fill="var(--dim)">'+m+'%</text>';
    }
  });
  if(isNum(pct)){
    const px=x(clamp(pct,0,50));
    s+='<line x1="'+px.toFixed(1)+'" y1="20" x2="'+px.toFixed(1)+'" y2="58" stroke="var(--text)" stroke-width="2"/>';
    s+='<circle cx="'+px.toFixed(1)+'" cy="35" r="4.6" fill="var(--text)" stroke="#4f8cff" stroke-width="2.2"/>';
    const tx=clamp(px, L+34, W-R2-34);
    s+='<text x="'+tx.toFixed(1)+'" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">你 · 前 '+fx(pct,1)+'%</text>';
  }
  s+='</svg>';
  return s;
}

function weeklyReport(){
  const todo=state.tasks.filter(t=>!t.done);
  const over=todo.filter(t=>t.due<0);
  const soon=todo.filter(t=>t.due>=0&&t.due<=7);
  const m=state.meetings[0];
  const lit=state.lits.filter(l=>l.status!=='done');
  const lines=[];
  lines.push('本周进展');
  lines.push('· 完成课程与实验任务 '+state.tasks.filter(t=>t.done).length+' 项，在办 '+todo.length+' 项');
  if(over.length) lines.push('· 已逾期 '+over.length+' 项：'+over.map(t=>t.title).join('；'));
  if(soon.length) lines.push('· 一周内到期：'+soon.map(t=>t.title+'（还剩 '+t.due+' 天）').join('；'));
  if(m) lines.push('· 最近一次组会：'+m.report);
  if(lit.length) lines.push('· 在读文献：'+lit.map(l=>l.title+'（'+l.progress+'%）').join('；'));
  lines.push('');
  lines.push('下周计划');
  if(m&&m.todo) lines.push('· '+m.todo);
  if(soon.length) lines.push('· 优先推进：'+soon.slice(0,2).map(t=>t.title).join('；'));
  lines.push('· 完成上述在办事项并同步导师');
  return lines.join('\n');
}

function renderNav(){
  const mk=list=>list.map(n=>`<a class="nav-item ${current===n.v?'on':''}" data-go="${n.v}">${icon(n.icon)}<span>${n.name}</span></a>`).join('');
  $('#nav').innerHTML=mk(NAV);
  $('#nav-tools').innerHTML=mk(TOOLS);
  $('#tabbar').innerHTML=NAV.map(n=>`<a class="${current===n.v?'on':''}" data-go="${n.v}">${icon(n.icon)}<span>${n.name}</span></a>`).join('');
}

function render(){
  const t=TITLES[current]||['学迹',''];
  $('#page-title').textContent=t[0];
  $('#page-sub').textContent=t[1];
  const semSeg=$('#sem-seg');
  semSeg.style.display = current==='course' ? 'none' : 'none';
  $('#view').innerHTML=(VIEWS[current]||VIEWS.home)();
  renderNav();
  bind();
}

let suppressHash=false;
function go(v){
  current=v;
  suppressHash=true;
  if(location.hash.slice(1)!==v) location.hash=v;
  suppressHash=false;
  render();
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',()=>{
  if(suppressHash) return;
  const h=location.hash.slice(1);
  if(TITLES[h]&&h!==current){ current=h; render(); }
});

function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));

  // 课程分数
  document.querySelectorAll('[data-score]').forEach(inp=>{
    inp.onchange=()=>{
      const c=state.courses.find(x=>x.id===inp.dataset.score);
      const v=clamp(num(inp.value)??0,0,100);
      c.score=v; save(); toast('已更新 '+c.name+' 的成绩'); render();
    };
  });

  // 学期切换
  document.querySelectorAll('[data-sem]').forEach(b=>{
    b.onclick=()=>{ state.activeSem=b.dataset.sem; save(); render(); };
  });

  // 综测细项
  document.querySelectorAll('[data-dim][data-item]').forEach(inp=>{
    inp.onchange=()=>{
      const d=inp.dataset.dim, k=inp.dataset.item;
      if(!state.items[d]) state.items[d]={};
      const v=inp.value===''?null:clamp(num(inp.value)??0,0,100);
      state.items[d][k]=v; save(); render();
    };
  });

  // 待办
  const ti=$('#task-input');
  if(ti){
    ti.onkeydown=e=>{
      if(e.key==='Enter'&&ti.value.trim()){
        state.tasks.unshift({id:'t'+Date.now(),title:ti.value.trim(),kind:$('#task-kind').value,priority:'normal',due:7,done:false});
        save(); toast('已添加'); render();
      }
    };
  }
  document.querySelectorAll('[data-done]').forEach(b=>{
    b.onclick=()=>{
      const t=state.tasks.find(x=>x.id===b.dataset.done);
      if(t){ t.done=true; save(); toast('已完成：'+t.title); render(); }
    };
  });

  // 周报复制
  const cw=$('#copy-week');
  if(cw) cw.onclick=()=>{
    const txt=weeklyReport();
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('周报已复制'),()=>toast('复制失败，请手动选择'));
    else toast('当前环境不支持自动复制');
  };

  // 档案
  document.querySelectorAll('[data-prof]').forEach(inp=>{
    inp.onchange=()=>{
      const k=inp.dataset.prof;
      state.profile[k]=k==='targetGpa'? (num(inp.value)||3.8) : (num(inp.value)||0);
      save(); render();
    };
  });

  // 口径
  document.querySelectorAll('[data-cfg]').forEach(el=>{
    el.onchange=()=>{
      const k=el.dataset.cfg;
      state.config[k]= k==='gpaMode'? el.value : (num(el.value)||0);
      save(); render();
    };
  });
  document.querySelectorAll('[data-eval]').forEach(inp=>{
    inp.onchange=()=>{ state.config.eval[inp.dataset.eval]=num(inp.value)||0; save(); render(); };
  });
  document.querySelectorAll('[data-dimw]').forEach(inp=>{
    inp.onchange=()=>{ state.config.eval.dimWeights[inp.dataset.dimw]=num(inp.value)||0; save(); render(); };
  });
  document.querySelectorAll('[data-sch]').forEach(inp=>{
    inp.onchange=()=>{
      const t=state.config.scholarship.find(x=>x.key===inp.dataset.sch);
      if(t){ t.pct=num(inp.value)||0; save(); render(); }
    };
  });

  // 导出 / 重置
  const ex=$('#export-btn');
  if(ex) ex.onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='xueji-data.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('已导出 JSON');
  };
  const rs=$('#reset-btn');
  if(rs) rs.onclick=()=>{
    state=freshState(); save(); toast('已重置为演示数据'); render();
  };

  // 绩点模拟
  document.querySelectorAll('[data-sim]').forEach(r=>{
    r.oninput=()=>{
      const c=state.courses.find(x=>x.id===r.dataset.sim);
      const gp=scoreToGp(num(r.value),cfg().gpaMode);
      const lab=document.querySelector('[data-sim-label="'+r.dataset.sim+'"]');
      if(lab) lab.textContent=fx(gp,2)+' 绩点';
    };
  });
}

/* 主题（键与站内其它页一致：dx_theme） */
function initTheme(){
  let t=document.documentElement.getAttribute('data-theme')||'dark';
  const b=$('#theme-btn');
  b.textContent = t==='dark' ? '浅色' : '深色';
  b.onclick=()=>{
    const nt=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nt);
    try{ localStorage.setItem('dx_theme',nt); }catch(e){}
    b.textContent = nt==='dark' ? '浅色' : '深色';
    render();
  };
}

/* 启动 */
initTheme();
(function(){
  const h=location.hash.slice(1);
  if(TITLES[h]) current=h;
})();
render();
window.__xuejiReady = true;
window.xueji = { get state(){ return state; }, summarize, evaluate, scoreToGp, bySemester };
})();
</script>
</body>
</html>
