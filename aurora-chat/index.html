## 🌌 极光为什么是绿色的？

极光是太阳风的带电粒子被地球磁场导向两极、撞击高层大气而产生的。**颜色由气体种类和高度共同决定**：

| 颜色 | 高度 | 来源 |
| --- | --- | --- |
| 🟢 绿色 | 100–300 km | 氧原子（人眼最敏感，所以最常见） |
| 🔴 红色 | 300 km 以上 | 高层稀薄的氧 |
| 🟣 蓝紫 | ~100 km | 氮分子 |

> 💡 观测提示：高纬度 + 远离光污染 + 冬季晴夜 + 避开满月，四个条件凑齐成功率最高。

把这个界面换成"极光绿"主题色的灵感正来源于此。

## 🐍 用 Python 感受中心极限定理

不管总体什么分布，样本均值的分布会随样本量增大而趋近正态分布——这就是中心极限定理。30 行代码即可亲眼验证：

```python
import random, statistics

def sample_means(distribution, n, times=2000):
    return [statistics.mean(distribution() for _ in range(n))
            for _ in range(times)]

# 一个极度偏斜的总体：90% 的值是 0，10% 的值是 100
population = lambda: 100 if random.random() < 0.1 else 0

for n in (2, 10, 50):
    means = sample_means(population, n)
    print(f"n={n:>3}  均值={statistics.mean(means):.2f}  "
          f"标准差={statistics.stdev(means):.2f}")
```

**输出解读**：`n` 越大，样本均值的标准差越小（约按 `1/√n` 收缩），分布形状越来越像钟形曲线——即使总体本身歪得不成样子。

这就是它在统计推断里如此重要的原因：**我们能对"均值"做正态假设，而不必知道总体长什么样。**

### 这是什么项目？

**Aurora Chat（极光）** 是一个纯静态的 AI 聊天工作台：

- 🛰️ **零后端**——浏览器直连各服务商 API，无需自建服务器
- 🔐 **隐私**——对话与 API Key 只存在浏览器 `localStorage`，不经过任何第三方
- ⚔️ **对比模式**——灵感来自 LMSYS Chatbot Arena，同一问题双模型并行作答
- 📚 **提示词库**——灵感来自 awesome-chatgpt-prompts，内置常用角色模板
