<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>璇玑星海 · 戴璇的记忆星系 | daixuan.cloud</title>
  <meta name="description" content="璇玑星海——戴璇个人网站的沉浸式 3D 记忆星系：粒子星系中央光柱矗立，十张里程碑卡片绕轨漂浮，点击卡片查看每段旅程的印记与传送门。原生 Canvas 实现，零依赖。">
  <meta name="author" content="戴璇">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://daixuan.cloud/galaxy/">
  <meta name="theme-color" content="#05070f">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <meta property="og:title" content="璇玑星海 · 戴璇的记忆星系">
  <meta property="og:description" content="粒子星系 + 绕轨里程碑卡片，原生 Canvas 零依赖实现的沉浸式个人记忆星系。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daixuan.cloud/galaxy/">
  <meta property="og:site_name" content="戴璇 · Dai Xuan">
  <meta property="og:locale" content="zh_CN">

  <style>
    /* ============================================================
       璇玑星海 · 单文件自包含（原生 Canvas + DOM 轨道卡片）
       深空视觉固定为暗色主题；尊重 prefers-reduced-motion
       ============================================================ */
    :root {
      --space-bg: #05070f;
      --glass: rgba(15, 20, 38, 0.72);
      --glass-border: rgba(148, 163, 184, 0.22);
      --text-hi: #f8fafc;
      --text-mid: #b6c2d9;
      --text-low: #8494ab;
      --indigo: #818cf8;
      --violet: #a855f7;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --grad: linear-gradient(135deg, #818cf8 0%, #6366f1 28%, #a855f7 62%, #ec4899 100%);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "HarmonyOS Sans SC", "MiSans", Roboto, "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: var(--font);
      color: var(--text-hi);
      background:
        radial-gradient(1200px 700px at 18% -10%, rgba(99, 102, 241, 0.16), transparent 62%),
        radial-gradient(1000px 620px at 86% 108%, rgba(236, 72, 153, 0.10), transparent 60%),
        radial-gradient(900px 500px at 50% 55%, rgba(34, 211, 238, 0.05), transparent 65%),
        var(--space-bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---- 顶部栏 ---- */
    .g-topbar {
      position: fixed;
      top: calc(18px + var(--safe-top));
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 30;
      pointer-events: none;
    }

    .g-topbar > * { pointer-events: auto; }

    .g-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      color: var(--text-hi);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .g-back:hover {
      transform: translateY(-2px);
      border-color: rgba(129, 140, 248, 0.55);
      box-shadow: 0 12px 34px rgba(99, 102, 241, 0.25);
    }

    .g-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      font-size: 0.76rem;
      color: var(--text-mid);
      letter-spacing: 0.08em;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .g-badge i {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* ---- 标题 ---- */
    .g-title {
      position: fixed;
      top: calc(11vh + var(--safe-top));
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    .g-title h1 {
      font-size: clamp(1.7rem, 4.6vw, 2.7rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(129, 140, 248, 0.35));
    }

    .g-title p {
      margin-top: 10px;
      font-size: clamp(0.78rem, 2vw, 0.9rem);
      color: var(--text-low);
      letter-spacing: 0.28em;
      text-indent: 0.28em;
    }

    /* ---- 底部提示 ---- */
    .g-hint {
      position: fixed;
      bottom: calc(22px + var(--safe-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-low);
      letter-spacing: 0.12em;
      z-index: 10;
      pointer-events: none;
      user-select: none;
      padding: 0 16px;
    }

    .g-hint b { color: var(--text-mid); font-weight: 600; }

    /* ---- 轨道里程碑卡片 ---- */
    .star-card {
      position: fixed;
      top: 0;
      left: 0;
      width: 158px;
      padding: 13px 14px 12px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      text-align: left;
      color: var(--text-hi);
      font-family: inherit;
      will-change: transform, opacity;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .star-card:hover,
    .star-card:focus-visible {
      border-color: rgba(129, 140, 248, 0.65);
      box-shadow: 0 18px 46px rgba(99, 102, 241, 0.35);
      outline: none;
    }

    .star-card .sc-emoji { font-size: 1.5rem; line-height: 1; display: block; }

    .star-card .sc-title {
      display: block;
      margin-top: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .star-card .sc-meta {
      display: block;
      margin-top: 4px;
      font-size: 0.66rem;
      color: var(--text-low);
      letter-spacing: 0.05em;
    }

    .star-card::after {
      content: "查看印记 ↗";
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 0.62rem;
      color: var(--indigo);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .star-card:hover::after { opacity: 1; }

    /* ---- 聚形按钮 & 氛围音按钮 ---- */
    .g-morph {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(129, 140, 248, 0.45);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(236, 72, 153, 0.14));
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      color: var(--text-hi);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.25);
      font-family: inherit;
    }

    .g-morph:hover {
      transform: translateY(-2px);
      border-color: rgba(129, 140, 248, 0.8);
      box-shadow: 0 12px 36px rgba(99, 102, 241, 0.4);
    }

    .g-morph[aria-pressed="true"] {
      border-color: rgba(253, 246, 227, 0.55);
      box-shadow: 0 0 24px rgba(253, 246, 227, 0.25), 0 8px 30px rgba(99, 102, 241, 0.3);
    }

    .g-sound {
      position: fixed;
      bottom: calc(22px + var(--safe-bottom));
      left: calc(20px + env(safe-area-inset-left, 0px));
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      color: var(--text-mid);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      font-family: inherit;
    }

    .g-sound:hover { transform: translateY(-2px); color: var(--text-hi); border-color: rgba(129, 140, 248, 0.55); }

    .g-sound[aria-pressed="true"] { color: var(--text-hi); border-color: rgba(129, 140, 248, 0.65); }
    .g-sound[aria-pressed="true"] span:first-child { color: var(--indigo); text-shadow: 0 0 12px rgba(129, 140, 248, 0.8); }

    /* ---- 留言墙按钮 & 抽屉 ---- */
    .g-wall-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      color: var(--text-mid);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      font-family: inherit;
    }

    .g-wall-btn:hover { transform: translateY(-2px); color: var(--text-hi); border-color: rgba(129, 140, 248, 0.55); }

    .g-wall-btn[aria-expanded="true"] { color: var(--text-hi); border-color: rgba(129, 140, 248, 0.65); }

    .wall-drawer {
      position: fixed;
      top: calc(76px + var(--safe-top));
      right: calc(20px + env(safe-area-inset-right, 0px));
      bottom: calc(20px + var(--safe-bottom));
      width: min(400px, calc(100vw - 32px));
      z-index: 60;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: rgba(10, 14, 28, 0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      opacity: 0;
      transform: translateX(24px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wall-drawer.open { opacity: 1; transform: translateX(0); }

    .wall-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--glass-border);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.16), rgba(236, 72, 153, 0.08));
      font-size: 0.92rem;
    }

    .wall-spark { color: var(--indigo); text-shadow: 0 0 12px rgba(129, 140, 248, 0.8); }

    .wall-close {
      margin-left: auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-mid);
      font-size: 1.05rem;
      cursor: pointer;
    }

    .wall-close:hover { color: #fff; border-color: rgba(129, 140, 248, 0.6); }

    .wall-body {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 12px 6px;
    }

    .wall-note {
      padding: 10px 16px;
      font-size: 0.72rem;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.08);
      border-bottom: 1px solid var(--glass-border);
      letter-spacing: 0.02em;
    }

    .wall-loading {
      text-align: center;
      color: var(--text-low);
      font-size: 0.8rem;
      padding: 36px 16px;
      letter-spacing: 0.1em;
    }

    .wall-item {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(148, 163, 184, 0.06);
      margin-bottom: 10px;
      animation: twinMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wall-item .wi-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 5px;
    }

    .wall-item .wi-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--indigo);
    }

    .wall-item .wi-date {
      margin-left: auto;
      font-size: 0.66rem;
      color: var(--text-low);
      font-variant-numeric: tabular-nums;
    }

    .wall-item .wi-text {
      font-size: 0.84rem;
      color: var(--text-mid);
      line-height: 1.7;
      word-break: break-word;
    }

    .wall-empty {
      text-align: center;
      color: var(--text-low);
      font-size: 0.82rem;
      padding: 30px 16px;
    }

    .wall-form {
      padding: 10px 12px 6px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .wall-input {
      width: 100%;
      padding: 9px 13px;
      border-radius: 11px;
      border: 1px solid var(--glass-border);
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-hi);
      font-size: 0.84rem;
      font-family: inherit;
      resize: none;
    }

    .wall-input:focus {
      outline: none;
      border-color: rgba(129, 140, 248, 0.65);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .wall-form-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wall-submit {
      padding: 8px 18px;
      border-radius: 10px;
      border: none;
      background: var(--grad);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .wall-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); }

    .wall-mail {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-low);
      text-decoration: none;
    }

    .wall-mail:hover { color: var(--indigo); text-decoration: underline; }

    .wall-foot {
      padding: 8px 14px 10px;
      font-size: 0.66rem;
      color: var(--text-low);
      text-align: center;
      border-top: 1px solid var(--glass-border);
    }

    /* ---- 语言切换 ---- */
    .g-lang { position: relative; }

    .g-lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      color: var(--text-mid);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      font-family: inherit;
    }

    .g-lang-btn:hover { transform: translateY(-2px); color: var(--text-hi); border-color: rgba(129, 140, 248, 0.55); }

    .g-lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 150px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(10, 14, 28, 0.94);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      padding: 6px;
      z-index: 70;
    }

    .g-lang-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 14px;
      border-radius: 9px;
      border: none;
      background: none;
      color: var(--text-mid);
      font-size: 0.84rem;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s ease;
    }

    .g-lang-menu button:hover { background: rgba(129, 140, 248, 0.14); color: var(--text-hi); }
    .g-lang-menu button.active { background: rgba(99, 102, 241, 0.22); color: var(--text-hi); font-weight: 700; }

    /* ---- 印记弹窗 ---- */
    .imprint-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(3, 5, 12, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .imprint-overlay.active { opacity: 1; visibility: visible; }

    .imprint-card {
      width: min(440px, 100%);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 40px 110px rgba(0, 0, 0, 0.6), 0 0 40px -12px rgba(99, 102, 241, 0.35);
      padding: 28px;
      transform: translateY(14px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .imprint-overlay.active .imprint-card { transform: translateY(0) scale(1); }

    .imprint-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      color: var(--indigo);
      text-transform: uppercase;
    }

    .imprint-kicker::before { content: "✦"; }

    .imprint-title {
      margin-top: 10px;
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .imprint-period {
      margin-top: 4px;
      font-size: 0.76rem;
      color: var(--text-low);
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }

    .imprint-desc {
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--text-mid);
      line-height: 1.75;
    }

    .imprint-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .imprint-tags span {
      font-size: 0.68rem;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      color: var(--text-mid);
      background: rgba(148, 163, 184, 0.08);
    }

    .imprint-actions { margin-top: 22px; display: flex; gap: 12px; align-items: center; }

    .imprint-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 12px;
      background: var(--grad);
      color: #fff;
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(99, 102, 241, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .imprint-link:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(99, 102, 241, 0.5); }

    .imprint-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-mid);
      font-size: 1.15rem;
      cursor: pointer;
      transition: 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .imprint-close:hover { color: #fff; border-color: rgba(129, 140, 248, 0.6); }

    /* ---- 星海唤醒幕 ---- */
    .gw-boot {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--space-bg);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .gw-boot.is-done { opacity: 0; visibility: hidden; }

    .gw-boot .gwb-heart {
      font-size: 2rem;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gwbPulse 1.2s ease-in-out infinite;
    }

    @keyframes gwbPulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50%      { transform: scale(1.18); opacity: 1; }
    }

    .gw-boot .gwb-text {
      font-size: 0.82rem;
      color: var(--text-low);
      letter-spacing: 0.3em;
      text-indent: 0.3em;

      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText('璇', size / 2, size / 2 + 6);
      var data = octx.getImageData(0, 0, size, size).data;
      var pts = [];
      for (var y = 0; y < size; y += 4) {
        for (var x = 0; x < size; x += 4) {
          if (data[(y * size + x) * 4 + 3] > 140) {
            pts.push({ x: x - size / 2, y: y - size / 2 });

    function glyphLayout() {

          tx: lay.cx + p.x * lay.scale,
          ty: lay.cy + p.y * lay.scale,
          delay: Math.random() * 0.45,
          dur: 0.9 + Math.random() * 0.5,
          warm: i % 6 !== 0,
          seed: Math.random() * Math.PI * 2

      if (morph.phase === 'idle') return;
      var t = seconds() - morph.t0;

        for (var i = 0; i < morph.parts.length; i++) {

          var e = easeInOut(k);
          var x = p.fx + (p.tx - p.fx) * e;
          var y = p.fy + (p.ty - p.fy) * e;
          ctx.globalAlpha = 0.15 + 0.8 * e;

    var soundBtn = document.getElementById('sound-btn');
    var soundLabel = document.getElementById('sound-label');
    var ambience = { ctx: null, master: null, on: false };

    function buildAmbience() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      var actx = new AC();
      var master = actx.createGain();
      master.gain.value = 0;
      master.connect(actx.destination);

      // 高寒风声：白噪声 → 带通，中心频率被超低频 LFO 缓慢推移
      var buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      var noise = actx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;
      var bp = actx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 420;
      bp.Q.value = 0.7;
      var nGain = actx.createGain();
      nGain.gain.value = 0.05;
      noise.connect(bp); bp.connect(nGain); nGain.connect(master);
      var lfo = actx.createOscillator();
      lfo.frequency.value = 0.07;
      var lfoGain = actx.createGain();
      lfoGain.gain.value = 160;
      lfo.connect(lfoGain); lfoGain.connect(bp.frequency);

      // 和声垫：A2-E3-A3-C#4 正弦叠置，各自带独立失谐漂移
      [110, 164.81, 220, 277.18].forEach(function (freq, idx) {
        var osc = actx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var g = actx.createGain();
        g.gain.value = 0.012;
        var lp = actx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 900;
        osc.connect(g); g.connect(lp); lp.connect(master);
        var det = actx.createOscillator();
        det.frequency.value = 0.05 + idx * 0.017;
        var detGain = actx.createGain();
        detGain.gain.value = 1.4;
        det.connect(detGain); detGain.connect(osc.detune);
        det.start();
        osc.start();
      });

      lfo.start();
      noise.start();
      ambience.ctx = actx;
      ambience.master = master;
      return true;
    }

    function toggleSound() {
      if (!ambience.ctx && !buildAmbience()) {
        if (soundLabel) soundLabel.textContent = '氛围音 · N/A';
        return;
      }
      ambience.on = !ambience.on;
      var actx = ambience.ctx;
      if (actx.state === 'suspended') actx.resume();
      ambience.master.gain.setTargetAtTime(ambience.on ? 0.9 : 0, actx.currentTime, 0.8);
      if (soundBtn) soundBtn.setAttribute('aria-pressed', String(ambience.on));
      if (soundLabel) {
        var c = I18N[getLang()] ? I18N[getLang()].chrome : null;
        soundLabel.textContent = ambience.on ? (c ? c.soundOn : 'Ambience · On') : (c ? c.soundOff : '氛围音 · 关');
        if (getLang() === 'zh-CN') soundLabel.textContent = ambience.on ? '氛围音 · 开' : '氛围音 · 关';
      }
    }

    if (soundBtn) soundBtn.addEventListener('click', toggleSound);

    /* ==================== 星空渲染 ==================== */
    var canvas = document.getElementById('sky');
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0, DPR = 1, CX = 0, CY = 0;

    var stars = [];      // 远景星野
    var disk = [];       // 星系旋盘
    var column = [];     // 中央光柱上升粒子
    var PALETTE = ['#818cf8', '#a855f7', '#ec4899', '#22d3ee'];

    function rand(a, b) { return a + Math.random() * (b - a); }

    function buildParticles() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      CX = W / 2;
      CY = H * 0.58;

      var area = W * H;
      var nStars = Math.round(area / 4200);
      stars = [];
      for (var i = 0; i < nStars; i++) {
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          r: rand(0.4, 1.4), ph: Math.random() * Math.PI * 2,
          sp: rand(0.4, 1.4), depth: rand(0.3, 1)
        });
      }

      disk = [];
      var nDisk = Math.round(Math.min(1700, area / 1000));
      for (var j = 0; j < nDisk; j++) {
        var t = Math.pow(Math.random(), 0.62);           // 内密外疏
        var r = 0.06 + t * 0.94;                          // 归一化半径
        var arm = Math.floor(Math.random() * 2);          // 双旋臂
        var ang = r * 5.2 + arm * Math.PI + rand(-0.42, 0.42);
        var color = r < 0.3 ? '#fdf6e3' : PALETTE[(Math.random() * PALETTE.length) | 0];
        disk.push({
          r: r, ang: ang,
          size: rand(0.7, 2.1) * (r < 0.3 ? 1.15 : 1),
          color: color,
          alpha: (0.16 + 0.84 * (1 - r)) * rand(0.55, 1),
          wSpeed: (0.10 / (0.25 + r)) * (Math.random() < 0.5 ? 1 : 1) // 内快外慢
        });
      }

      column = [];
      var nCol = Math.round(Math.min(220, area / 8000));
      for (var k = 0; k < nCol; k++) {
        column.push({ p: Math.random(), sp: rand(0.10, 0.30), sway: Math.random() * Math.PI * 2, size: rand(0.8, 2.4) });
      }
    }

    /* 视差 */
    var mx = 0.5, my = 0.5, px = 0, py = 0;

    if (!prefersReducedMotion) {
      window.addEventListener('pointermove', function (e) {
        mx = e.clientX / W;
        my = e.clientY / H;
      }, { passive: true });
    }

    var orbitR = 0, orbitSquash = 0.30, orbitSpeed = 0.055, T = 0;

    function layout() {
      var mobile = W < 640;
      orbitR = Math.min(W * (mobile ? 0.40 : 0.37), 500);
      // 窄屏：椭圆竖向拉长成环带，避免卡片在水平窄轨道上叠成一团
      orbitSquash = mobile ? 0.92 : 0.30;
    }

    function render() {
      px += ((mx - 0.5) * 26 - px) * 0.045;
      py += ((my - 0.5) * 16 - py) * 0.045;

      ctx.clearRect(0, 0, W, H);

      /* 远景星野（微视差） */
      ctx.globalCompositeOperation = 'source-over';
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = prefersReducedMotion ? 0.7 : (0.45 + 0.55 * Math.abs(Math.sin(T * s.sp + s.ph)));
        ctx.globalAlpha = tw * 0.8;
        ctx.fillStyle = '#cdd7f3';
        ctx.fillRect(s.x - px * s.depth * 0.4, s.y - py * s.depth * 0.4, s.r, s.r);
      }

      ctx.globalCompositeOperation = 'lighter';

      /* 地面辉光环 */
      var gr = ctx.createRadialGradient(CX - px, CY + 8 - py, 0, CX - px, CY + 8 - py, orbitR * 0.95);
      gr.addColorStop(0, 'rgba(129, 140, 248, 0.20)');
      gr.addColorStop(0.55, 'rgba(168, 85, 247, 0.07)');
      gr.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.ellipse(CX - px, CY + 8 - py, orbitR * 0.95, orbitR * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();

      /* 星系旋盘（椭圆压扁 + 差速旋转） */
      var squash = 0.34;
      for (var d = 0; d < disk.length; d++) {
        var pt = disk[d];
        var a = pt.ang + (prefersReducedMotion ? 0 : T * pt.wSpeed);
        var rx = pt.r * orbitR * 1.18;
        var x = CX - px * 0.85 + Math.cos(a) * rx;
        var y = CY + 6 - py * 0.85 + Math.sin(a) * rx * squash;
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.fillRect(x, y, pt.size, pt.size);
      }

      /* 中央光柱：柔和光束 + 自地平线升起的粒子流（聚形时自动变暗让位） */
      var colTop = H * 0.26, colBase = CY + 10;
      var colDim = (morph.phase !== 'idle') ? 0.22 : 1;

      /* 光束本体（低透明度垂直渐变线） */
      var beam = ctx.createLinearGradient(0, colBase, 0, colTop);
      beam.addColorStop(0, 'rgba(129, 140, 248, ' + (0.16 * colDim).toFixed(3) + ')');
      beam.addColorStop(0.65, 'rgba(142, 160, 255, ' + (0.13 * colDim).toFixed(3) + ')');
      beam.addColorStop(1, 'rgba(253, 246, 227, ' + (0.22 * colDim).toFixed(3) + ')');
      ctx.strokeStyle = beam;
      ctx.lineWidth = 54;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(CX - px * 0.5, colBase);
      ctx.lineTo(CX - px * 0.5, colTop);
      ctx.stroke();
      ctx.lineWidth = 16;
      ctx.globalAlpha = 0.85 * colDim;
      ctx.stroke();
      ctx.globalAlpha = 1;

      for (var c = 0; c < column.length; c++) {
        var cp = column[c];
        var prog = prefersReducedMotion ? cp.p : ((cp.p + T * cp.sp * 0.5) % 1);
        var y = colBase - prog * (colBase - colTop);
        var narrow = 1 - prog * 0.82;                       // 越高越收束
        var x = CX - px * 0.5 + Math.sin(cp.sway + prog * 7) * 14 * narrow;
        var fade = Math.sin(prog * Math.PI);                // 两端淡出
        ctx.globalAlpha = 0.85 * fade * colDim;
        ctx.fillStyle = prog > 0.72 ? '#fdf6e3' : '#9aa8ff';
        ctx.fillRect(x, y, cp.size * narrow + 0.6, cp.size * narrow + 0.6);
      }

      /* 聚形字（若在进行中） */
      drawMorph();

      /* 顶端脉冲星 */
      var pulse = prefersReducedMotion ? 1 : (1 + 0.16 * Math.sin(T * 2.4));
      var sx = CX - px * 0.5, sy = colTop - 16 - py * 0.5;
      var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 46 * pulse);
      sg.addColorStop(0, 'rgba(253, 246, 227, 0.95)');
      sg.addColorStop(0.25, 'rgba(129, 140, 248, 0.55)');
      sg.addColorStop(1, 'rgba(129, 140, 248, 0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(sx, sy, 46 * pulse, 0, Math.PI * 2);
      ctx.fill();

      /* 四芒 */
      ctx.strokeStyle = 'rgba(253, 246, 227, 0.9)';
      ctx.lineWidth = 1.4;
      var L = 15 * pulse;
      ctx.beginPath();
      ctx.moveTo(sx - L, sy); ctx.lineTo(sx + L, sy);
      ctx.moveTo(sx, sy - L); ctx.lineTo(sx, sy + L);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    function placeCards() {
      var mobile = W < 640;
      var lift = mobile ? -104 : -130;
      for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        var a = c.angle + (prefersReducedMotion ? 0 : T * orbitSpeed);
        var bobY = prefersReducedMotion ? 0 : Math.sin(T * 1.3 + c.bob) * 7;
        var x = CX - px * 1.25 + Math.cos(a) * orbitR;
        var depth = (Math.sin(a) + 1) / 2;                  // 0 远 → 1 近
        var y = CY + 26 - py * 1.25 + Math.sin(a) * orbitR * orbitSquash + bobY + lift + depth * 46;
        var scale = 0.72 + depth * 0.36;
        var alpha = (mobile ? 0.22 : 0.34) + depth * (mobile ? 0.78 : 0.66);
        var el = c.el;
        el.style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
        el.style.zIndex = String(10 + Math.round(depth * 18));
        el.style.opacity = alpha.toFixed(3);
        el.style.pointerEvents = depth < 0.14 ? 'none' : 'auto';
      }
    }

    function frame() {
      T += 1 / 60;
      render();
      placeCards();
    }

    var rafId = null;
    function loop() {
      rafId = null;
      if (document.hidden) return;
      frame();
      rafId = requestAnimationFrame(loop);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && rafId === null && !prefersReducedMotion) rafId = requestAnimationFrame(loop);
    });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        buildParticles();
        layout();
        render();
        placeCards();
      }, 120);
    });

    buildParticles();
    layout();

    // 语言应用需在卡片、音效、聚形组件全部构建完成后执行
    if (langBtn && langMenu) {
      applyLang(getLang());
    }

    if (prefersReducedMotion) {
      render();       // 静帧星海
      placeCards();
    } else {
      rafId = requestAnimationFrame(loop);
    }
  })();
  </script>
</body>
</html>
